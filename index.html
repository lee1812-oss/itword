<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1B3F">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IT 영단어">
<title>짬짬이 IT 영단어</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#F3F5F9;--surface:#FFFFFF;--surface2:#F8FAFC;--border:#E2E7EF;--border2:#CBD3E0;
  --text:#0F1A2E;--text2:#4A5568;--text3:#8A94A6;
  --primary:#1D4ED8;--primary2:#1E40AF;--p50:#EFF4FF;--p100:#DBE6FE;
  --navy:#0B1B3F;--navy2:#13306B;
  --ok:#0E9F6E;--okbg:#E9F8F1;--bad:#DC3B31;--badbg:#FDEDEB;--warn:#B45309;--warnbg:#FEF6E6;
  --shadow:0 1px 2px rgba(15,26,46,.04),0 2px 8px rgba(15,26,46,.05);
  --shadow2:0 8px 28px rgba(15,26,46,.10);
  --r:16px;--r2:12px;
  --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0A0F1C;--surface:#111827;--surface2:#151E30;--border:#222D42;--border2:#33405A;
  --text:#E8EDF6;--text2:#A9B4C7;--text3:#6E7A90;
  --primary:#5B8DEF;--primary2:#7AA3F5;--p50:#14213F;--p100:#1B2C54;
  --navy:#0E1C3D;--navy2:#1A3577;
  --ok:#34C98E;--okbg:#0F2A20;--bad:#F2726A;--badbg:#36181A;--warn:#F0B54A;--warnbg:#33260F;
  --shadow:0 1px 2px rgba(0,0,0,.3);--shadow2:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--text);background:var(--bg);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:var(--text)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:16px;height:16px}svg.i.l{width:24px;height:24px}
/* ── 레이아웃 ── */
.shell{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0}
#app{max-width:1040px;margin:0 auto;padding:20px 18px calc(92px + env(safe-area-inset-bottom))}
.mtop{display:flex;align-items:center;gap:10px;padding:14px 18px 0;max-width:1040px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.02em}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--navy));color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:-.03em;box-shadow:0 2px 6px rgba(29,78,216,.35)}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--text3);letter-spacing:0}
.chip-streak{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text2)}
.chip-streak svg{color:#F97316}
@media(min-width:960px){
  .side{display:flex;flex-direction:column;width:248px;flex:none;position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--border);padding:22px 14px}
  .side .brand{padding:0 8px 22px}
  .side nav{display:flex;flex-direction:column;gap:2px}
  .side nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--text2);font-weight:500;text-align:left}
  .side nav button:hover{background:var(--surface2);color:var(--text)}
  .side nav button.on{background:var(--p50);color:var(--primary);font-weight:700}
  .side .foot{margin-top:auto;padding:14px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);font-size:13px;color:var(--text2)}
  .side .foot b{display:block;font-size:20px;color:var(--text)}
  .mtop{display:none}
  nav.bottom{display:none!important}
  #app{padding:32px 36px 48px}
  body.focus .side{display:none}
}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .in{display:flex;max-width:640px;margin:0 auto}
nav.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:500;color:var(--text3)}
nav.bottom button.on{color:var(--primary);font-weight:700}
body.focus nav.bottom,body.focus .mtop{display:none}
/* ── 공통 ── */
.ph{display:flex;align-items:flex-end;gap:16px;margin:4px 0 20px;flex-wrap:wrap}
.ph .eyebrow{font-size:13px;font-weight:600;color:var(--primary);margin-bottom:4px}
.ph h1{font-size:26px;line-height:1.25;margin:0;font-weight:800;letter-spacing:-.03em}
.ph p{margin:6px 0 0;color:var(--text2);font-size:14px}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
@media(min-width:960px){.ph h1{font-size:30px}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.card-h h3{margin:0;font-size:16px;font-weight:700;letter-spacing:-.02em}
.card-h .sub{font-size:13px;color:var(--text3)}
.card-h .r{margin-left:auto}
.link{color:var(--primary);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:2px}
.muted{color:var(--text2)}.faint{color:var(--text3)}.sm{font-size:13px}.xs{font-size:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:var(--r2);font-weight:600;font-size:15px;background:var(--primary);color:#fff;border:1px solid var(--primary);transition:background .15s,transform .05s}
.btn:hover{background:var(--primary2)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--surface);color:var(--text);border-color:var(--border2)}
.btn.sec:hover{background:var(--surface2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{display:flex;width:100%}
.btn.okb{background:var(--ok);border-color:var(--ok)}
.btn.badb{background:var(--surface);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--border))}
.btn.badb:hover{background:var(--badbg)}
.btn.white{background:#fff;color:var(--navy);border-color:#fff}
.btn.white:hover{background:#EEF2FA}
.btn.glass{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
.btn.glass:hover{background:rgba(255,255,255,.2)}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--text2);border:1px solid var(--border);background:var(--surface)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.badge.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.badge.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.badge.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.badge.p{background:var(--p50);color:var(--primary);border-color:transparent}
.badge.cat{background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c);border-color:transparent}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,var(--primary)) 12%,var(--surface));color:var(--c,var(--primary))}
.ico.sm{width:32px;height:32px;border-radius:9px}
.bar{height:8px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.pbar{height:6px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--primary)) 14%,var(--surface2));overflow:hidden}
.pbar i{display:block;height:100%;border-radius:999px;background:var(--c,var(--primary))}
mark{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary);font-weight:700;padding:1px 4px;border-radius:5px}
/* ── 홈 ── */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:24px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#2E5FD8 0%,rgba(46,95,216,0) 55%),linear-gradient(135deg,#0B1B3F 0%,#132E6A 100%);box-shadow:0 12px 30px rgba(11,27,63,.25);display:flex;gap:24px;align-items:center;margin-bottom:16px}
.hero::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(90deg,transparent,#000 70%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .lbl{font-size:13px;font-weight:600;color:#A9C1F5;display:flex;align-items:center;gap:6px}
.hero .nums{display:flex;align-items:center;gap:18px;margin:10px 0 6px}
.hero .nums b{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
.hero .nums span{display:block;font-size:12px;color:#A9C1F5;margin-top:4px}
.hero .nums .sep{width:1px;height:36px;background:rgba(255,255,255,.18)}
.hero p{margin:0 0 16px;font-size:13.5px;color:#C9D6F2;max-width:460px}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap}
.hero .main{flex:1;min-width:0}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:118px;height:118px;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .t b{display:block;font-size:24px;font-weight:800;line-height:1}
.ring .t span{font-size:11px;color:#A9C1F5}
@media(max-width:560px){.hero{flex-direction:column;align-items:stretch;padding:20px}.ring{display:none}.hero .acts .btn{flex:1}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.kpi .h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);font-weight:500}
.kpi .h .ico{width:30px;height:30px;border-radius:9px}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:10px;line-height:1.1}
.kpi .v small{font-size:14px;color:var(--text3);font-weight:600;margin-left:2px}
.kpi .f{font-size:12px;color:var(--text3);margin-top:4px}
.cols{display:grid;gap:16px}
@media(min-width:900px){.cols{grid-template-columns:1.1fr 1fr}.cols .card{margin-bottom:0}.cols{margin-bottom:16px}}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:14px}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2)}
.legend i{width:8px;height:8px;border-radius:50%;flex:none}
.legend b{margin-left:auto;color:var(--text);font-weight:700}
.rows{display:flex;flex-direction:column}
.rowbtn{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid var(--border);text-align:left;width:100%}
.rowbtn:first-child{border-top:0;padding-top:2px}
.rowbtn .tx{flex:1;min-width:0}
.rowbtn .tx b{display:block;font-size:14.5px;font-weight:600}
.rowbtn .tx span{font-size:12.5px;color:var(--text3)}
.rowbtn .cnt{font-size:13px;font-weight:700;color:var(--text2)}
.rowbtn>svg:last-child{color:var(--text3)}
.rowbtn:hover .tx b{color:var(--primary)}
.quote{border-left:3px solid var(--primary);padding:2px 0 2px 14px;font-size:16.5px;line-height:1.65;font-weight:500}
.dday{display:flex;align-items:center;gap:14px}
.dday .n{margin-left:auto;font-size:26px;font-weight:800;color:var(--primary);letter-spacing:-.03em}
/* ── 분야 ── */
.grid2{display:grid;gap:14px}
@media(min-width:700px){.grid2{grid-template-columns:1fr 1fr}}
.catcard{display:block;text-align:left;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;transition:border-color .15s,box-shadow .15s}
.catcard:hover{border-color:color-mix(in srgb,var(--c) 45%,var(--border));box-shadow:var(--shadow2)}
.catcard .top{display:flex;align-items:center;gap:12px}
.catcard .top b{display:block;font-size:16px;font-weight:700;letter-spacing:-.02em}
.catcard .top span{font-size:12.5px;color:var(--text3)}
.catcard .top>svg{margin-left:auto;color:var(--text3)}
.catcard p{margin:12px 0 14px;font-size:13px;color:var(--text2)}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:5px;border-radius:999px;background:var(--surface2);border:1px solid var(--border)}
.segs i.done{background:var(--c);border-color:transparent}
.segs i.now{background:color-mix(in srgb,var(--c) 35%,transparent);border-color:transparent}
.catcard .nx{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:13px}
.catcard .nx span{color:var(--text3)}
.catcard .nx b{color:var(--c);font-weight:700}
.stepper{display:flex;align-items:flex-start;margin:4px 0 18px}
.stepper .st{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:11.5px;color:var(--text3);font-weight:500}
.stepper .st::before{content:'';position:absolute;top:11px;left:-50%;right:50%;height:2px;background:var(--border)}
.stepper .st:first-child::before{display:none}
.stepper .st.done::before,.stepper .st.now::before{background:var(--c)}
.stepper .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--border2);position:relative;z-index:1;font-size:11px;font-weight:700}
.stepper .st.done .dot{background:var(--c);border-color:var(--c);color:#fff}
.stepper .st.now .dot{border-color:var(--c);color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 15%,transparent)}
.stepper .st.now{color:var(--text);font-weight:700}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.modes{grid-template-columns:repeat(3,1fr)}}
.mode{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.mode:hover{border-color:var(--primary)}
.mode b{font-size:14.5px;font-weight:700}
.mode span{font-size:12.5px;color:var(--text3);margin-top:-6px}
.sec-t{font-size:13px;font-weight:700;color:var(--text3);letter-spacing:.02em;margin:22px 0 10px;text-transform:uppercase}
/* ── 학습 ── */
.study{max-width:720px;margin:0 auto}
.s-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.s-top .tt{flex:1;min-width:0}
.s-top .tt b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-top .tt span{font-size:12.5px;color:var(--text3)}
.timer{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;color:var(--text2);border:1px solid var(--border);border-radius:999px;padding:6px 10px;background:var(--surface)}
.timer.long{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,var(--border))}
.prog{height:6px;background:var(--surface2);border:1px solid var(--border);border-radius:99px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.flash{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow2);min-height:300px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;cursor:pointer;user-select:none}
.flash .term{font-size:40px;font-weight:800;letter-spacing:-.03em;word-break:break-word;line-height:1.15}
.flash .pron{color:var(--text3);margin-top:8px;font-size:15px}
.flash .hint{position:absolute;bottom:16px;left:0;right:0;font-size:12.5px;color:var(--text3);display:flex;align-items:center;justify-content:center;gap:6px}
.speak{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--text2);margin-top:14px}
.speak:hover{color:var(--primary);border-color:var(--primary)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.two .btn{min-height:52px;font-size:16px}
.qcard{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:22px}
.qtype{font-size:12.5px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:6px;margin-bottom:10px}
.prompt{font-size:20px;font-weight:700;line-height:1.5;letter-spacing:-.02em}
.prompt.term{font-size:32px;font-weight:800}
.blank{display:inline-block;min-width:84px;border-bottom:2px solid var(--primary);margin:0 4px;vertical-align:-2px}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:13px 14px;font-size:15.5px;min-height:56px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--primary);background:var(--p50)}
.opt .key{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:13px;font-weight:700;background:var(--surface2);border:1px solid var(--border);color:var(--text2)}
.opt.sel{border-color:var(--primary);background:var(--p50)}
.opt.sel .key{background:var(--primary);color:#fff;border-color:var(--primary)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .key{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .key{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default}
.alert{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:14px 16px;margin-top:14px;font-size:14px}
.alert b{display:block;font-size:15px}
.alert.ok{background:var(--okbg);color:var(--ok)}
.alert.bad{background:var(--badbg);color:var(--bad)}
.alert span{color:var(--text2)}
.spellin{width:100%;font-size:22px;font-weight:700;padding:14px 16px;border-radius:14px;border:1.5px solid var(--border2);background:var(--surface);text-align:center;margin-top:14px;letter-spacing:.01em}
.spellin:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--p50)}
/* 해설 */
.exp-h{display:flex;align-items:flex-start;gap:12px}
.exp-term{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.exp-pron{font-size:13px;color:var(--text3);margin-top:2px}
.exp-h .speak{margin:0 0 0 auto}
.exp-k{font-size:17px;font-weight:700;margin:12px 0 4px;color:var(--text)}
.exp-sec{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.exp-l{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text3);margin-bottom:4px}
.exp-sec p{margin:0;font-size:14.5px;color:var(--text2)}
.exp-sec.my .exp-l{color:var(--warn)}
.exp-sec.talk .exp-l{color:var(--primary)}
.exp-sec.talk p{color:var(--text);font-weight:500}
/* 짝 맞추기 */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:760px){.match{grid-template-columns:repeat(3,1fr)}}
.tile{min-height:80px;background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:10px;font-size:13.5px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow);color:var(--text2)}
.tile.t{font-weight:700;font-size:16px;color:var(--text)}
.tile.sel{border-color:var(--primary);background:var(--p50);box-shadow:0 0 0 3px var(--p100)}
.tile.gone{visibility:hidden}
.tile.no{background:var(--badbg);border-color:var(--bad)}
/* 단어장 */
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3)}
.search input{width:100%;padding:13px 14px 13px 42px;border-radius:12px;border:1px solid var(--border2);background:var(--surface);font-size:15px}
.search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--p50)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--border2);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;color:var(--text2);white-space:nowrap}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
html[data-theme="dark"] .chip.on{background:var(--primary);border-color:var(--primary)}
.wl{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-top:12px}
.wl .it{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--border);cursor:pointer}
.wl .it:first-child{border-top:0}
.wl .it:hover{background:var(--surface2)}
.wl .tx{flex:1;min-width:0}
.wl .tx b{font-size:15px;font-weight:700}
.wl .tx em{font-style:normal;font-size:12.5px;color:var(--text3);margin-left:6px}
.wl .tx div{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl .badge.cat{display:none}
@media(min-width:760px){.wl .badge.cat{display:inline-flex}}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.star{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;color:var(--border2)}
.star svg{width:18px;height:18px}
.star.on{color:#F5A524}.star.on svg{fill:#F5A524}
/* 표·차트 */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{border-bottom:1px solid var(--border);padding:10px 8px;text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--text3);font-weight:600;background:var(--surface2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tblwrap{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.chart{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:8px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.chart i{display:block;width:100%;max-width:28px;background:linear-gradient(180deg,var(--primary),color-mix(in srgb,var(--primary) 70%,var(--navy)));border-radius:6px 6px 2px 2px;min-height:3px}
.chart i.z{background:var(--border)}
.chart span{font-size:10.5px;color:var(--text3);margin-top:6px}
.big-status{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:2px 0 6px}
.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
@media(min-width:700px){.mini{grid-template-columns:repeat(4,1fr)}}
.mini div{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px}
.mini span{font-size:12px;color:var(--text3)}
.mini b{display:block;font-size:18px;font-weight:800;margin-top:2px}
.todo{list-style:none;padding:0;margin:0}
.todo li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--border);font-size:14px;color:var(--text2)}
.todo li:first-child{border-top:0;padding-top:0}
.todo li svg{color:var(--primary);margin-top:1px}
/* 설정 */
.group{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.group h4{margin:0;padding:14px 18px 10px;font-size:12.5px;font-weight:700;color:var(--text3);letter-spacing:.02em}
.srow{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--border)}
.srow .tx{flex:1;min-width:0}
.srow .tx b{display:block;font-size:14.5px;font-weight:600}
.srow .tx span{font-size:12.5px;color:var(--text3)}
.srow select,.srow input[type=date]{padding:9px 12px;border-radius:10px;border:1px solid var(--border2);background:var(--surface);font-size:14px;max-width:180px}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--border2);transition:.2s}
.switch i::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.switch input:checked+i{background:var(--primary)}
.switch input:checked+i::after{transform:translateX(18px)}
/* 모달·알림 */
.modal{position:fixed;inset:0;background:rgba(10,15,28,.5);backdrop-filter:blur(2px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .panel{background:var(--surface);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:var(--shadow2)}
@media(min-width:760px){.modal{align-items:center}.modal .panel{border-radius:20px}}
label.f{display:block;font-size:13px;font-weight:600;color:var(--text2);margin:14px 0 6px}
.inp{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border2);background:var(--surface);font-size:15px}
.inp:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--p50)}
textarea.inp{min-height:70px;resize:vertical}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:60;max-width:90%;box-shadow:var(--shadow2)}
.cheer{position:fixed;left:50%;top:16px;transform:translate(-50%,-160%);background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:999px;font-size:14.5px;font-weight:700;z-index:70;transition:transform .35s cubic-bezier(.2,.8,.2,1);white-space:nowrap;box-shadow:var(--shadow2);opacity:0;visibility:hidden}
.cheer.on{transform:translate(-50%,0);opacity:1;visibility:visible}
.empty{text-align:center;padding:36px 16px;color:var(--text3);font-size:14px}
.printonly{display:none}
@media print{
  @page{size:A4;margin:14mm 12mm}
  body{background:#fff;font-size:11pt}
  .side,nav.bottom,.mtop,.noprint,.toast,.cheer{display:none!important}
  #app{max-width:none;padding:0}
  .card,.kpi,.wl,.group{break-inside:avoid;box-shadow:none}
  .printonly{display:block}
  tr{break-inside:avoid}
  :root,html[data-theme="dark"]{--bg:#fff;--surface:#fff;--surface2:#f6f7f9;--text:#000;--text2:#333;--text3:#666;--border:#ccc}
}
/* ── v004: 노안 배려 가독성 (큰 글자·진한 글자·넓은 터치 영역) ── */
:root{--text2:#2F3A4D;--text3:#566174;--border:#DCE2EB;--border2:#BFC9D7}

.legend div{font-size:15.5px}
.rowbtn{padding:15px 4px}.rowbtn .tx b{font-size:17.5px}.rowbtn .tx span{font-size:15px}.rowbtn .cnt{font-size:15.5px}
.quote{font-size:19px}
.catcard .top b{font-size:19px}.catcard .top span{font-size:15px}.catcard p{font-size:15.5px}.catcard .nx{font-size:15.5px}
.segs i{height:7px}
.stepper .st{font-size:13.5px}.stepper .dot{width:28px;height:28px;font-size:13px}.stepper .st::before{top:13px}
.mode b{font-size:17px}.mode span{font-size:14.5px}
.sec-t{font-size:15px}
.s-top .tt b{font-size:18px}.s-top .tt span{font-size:15px}
.timer{font-size:16px;padding:8px 12px}

.two .btn{min-height:60px;font-size:18px}

.spellin{font-size:26px}
.exp-term{font-size:30px}.exp-pron{font-size:16px}.exp-k{font-size:20.5px}.exp-l{font-size:14.5px}.exp-sec p{font-size:17.5px;line-height:1.7}
.tile{font-size:16px;min-height:92px}.tile.t{font-size:19px}
.search input{font-size:17px;padding:15px 16px 15px 46px}
.chip{font-size:15.5px;padding:8px 16px}
.wl .it{padding:15px 18px}.wl .tx b{font-size:18px}.wl .tx em{font-size:15px}.wl .tx div{font-size:15.5px}
.star{width:44px;height:44px}.star svg{width:22px;height:22px}
table{font-size:15.5px}th{font-size:14px}.chart span{font-size:13px}
.big-status{font-size:26px}.mini span{font-size:14px}.mini b{font-size:21px}
.todo li{font-size:16px}

.srow select,.srow input[type=date]{font-size:16px;padding:11px 14px}
label.f{font-size:15.5px}.inp{font-size:17px}
.toast{font-size:16px}.cheer{font-size:16.5px}
nav.bottom button{font-size:13px;padding:10px 0 9px}nav.bottom svg.i{width:26px;height:26px}

/* ── v004: 재미 요소 (레벨·XP·미션·잔디·배지·콤보·축하) ── */
.lvchip{display:inline-flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-weight:700;font-size:15px;box-shadow:var(--shadow)}
.lvchip .lv{min-width:32px;height:32px;padding:0 6px;border-radius:999px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;background:linear-gradient(135deg,#F59E0B,#EA580C)}
.xp{margin:14px 0 18px;max-width:440px}
.xp .t{display:flex;justify-content:space-between;gap:10px;font-size:15px;color:#DCE5F7;margin-bottom:7px}
.xp .t b{color:#fff}
.xp .b{height:12px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden}

.mission{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--border)}

.mission .chk{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--border2);color:#fff;flex:none}

.mission .tx b{display:block;font-size:17px}
.mission .tx small{font-size:14px;color:var(--text3)}
.mission .pb{height:9px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);margin-top:8px;overflow:hidden}
.mission .pb i{display:block;height:100%;background:var(--primary);border-radius:999px}
.mission.done .pb i{background:var(--ok)}
.mission .rw{font-size:14px;font-weight:800;color:#C2410C;background:#FFF1E6;border-radius:999px;padding:5px 11px;white-space:nowrap}

.mission.done .rw{color:var(--ok);background:var(--okbg)}
.grass{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,15px);grid-auto-columns:15px;gap:4px;overflow-x:auto;padding:2px 2px 6px}
.grass i{border-radius:4px;background:var(--surface2);border:1px solid var(--border)}
.grass i.l1{background:#C7D7FB;border-color:transparent}.grass i.l2{background:#86A9F2;border-color:transparent}.grass i.l3{background:#3D6EDB;border-color:transparent}.grass i.l4{background:#1B3FA8;border-color:transparent}

.grass i.fut{visibility:hidden}
.glegend{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:13.5px;color:var(--text3);margin-top:10px}

.bdg .md svg{width:28px;height:28px}
.bdg b{display:block;font-size:15.5px;line-height:1.35}
.bdg span{display:block;font-size:13.5px;color:var(--text3);margin-top:3px;line-height:1.35}
.bdg.lock .md{background:var(--surface2);color:var(--text3);box-shadow:none;border:2px dashed var(--border2)}
.bdg.lock b{color:var(--text3)}
.combo{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:15px;color:#C2410C;background:#FFF1E6;border-radius:999px;padding:8px 12px}
html[data-theme="dark"] .combo{background:#3A2412;color:#FDBA74}
.xpfloat{position:fixed;left:50%;top:110px;font-weight:900;font-size:24px;color:#F97316;z-index:80;pointer-events:none;animation:xpf 1s ease-out forwards}

let S;
function blank(){return{w:{},days:{},set:{daily:5,goal:20,auto:false,rate:0.9,theme:'auto',meet:'',focus:'',fs:'m',rep:3,gap:0.8,repKo:false},custom:[],edit:{},hide:{},rounds:{},best:{},cur:null,created:Date.now(),xp:0,badges:{},cnt:{},quest:{}}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){S=blank()}
  if(S.xp==null)S.xp=Object.values(S.days||{}).reduce((a,d)=>a+(d.ok||0)*10+(d.ng||0)*2,0);   // 예전 기록으로 XP 채우기
  const b=blank();for(const k in b)if(S[k]==null)S[k]=b[k];for(const k in b.set)if(S.set[k]==null)S.set[k]=b.set[k]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('저장 공간이 부족해요. 설정에서 기록을 내보내 주세요.')}}
load();

let ALL=[],BYID={};
function buildWords(){
  ALL=[];BYID={};
  WORDS.forEach(w=>{const id=idOf(w);if(S.hide[id])return;const x=Object.assign({},w,S.edit[id]||{},{id,base:true});ALL.push(x);BYID[id]=x});
  S.custom.forEach(w=>{if(S.hide[w.id])return;const x=Object.assign({lv:1,p:'',d:'',my:'',s:''},w,{base:false});ALL.push(x);BYID[w.id]=x});
}
buildWords();
const st=id=>S.w[id]||(S.w[id]={b:0,due:0,ok:0,ng:0,sl:0,t:0,st:0,fs:0});
const peek=id=>S.w[id]||{b:0,due:0,ok:0,ng:0,sl:0,t:0,st:0,fs:0};
const catOf=id=>CATS.find(c=>c.id===id)||{id,name:id};

function level(b){return b===0?0:b<=2?1:b<=4?2:3}
const LV=[{n:'새 단어',c:'#CBD3E0'},{n:'익히는 중',c:'#F59E0B'},{n:'거의 익힘',c:'#3B82F6'},{n:'내 말 됐음',c:'#10B981'}];
function isDue(id){const x=peek(id);return x.b>0&&x.due<=today()}
function grade(id,ok,slow,first){
  const x=st(id),t=today();if(!x.fs)x.fs=t;
  if(!ok){x.b=1;x.due=t;x.ng++;return}
  x.ok++;if(slow)x.sl++;
  if(!first){if(x.due<=t)x.due=t+1;return}   // 틀렸다가 다시 맞힌 단어는 내일 다시 (단계는 안 올림)
  if(slow){x.b=Math.max(1,x.b);x.due=t+1}
  else{x.b=Math.min(6,x.b+1);x.due=t+INT[x.b]}
}
function logDay(n,ok,ng,sec){const k=dkey(today());const d=S.days[k]||(S.days[k]={n:0,ok:0,ng:0,sec:0});d.n+=n;d.ok+=ok;d.ng+=ng;d.sec+=Math.round(sec||0)}
function streak(){let n=0,t=today();if(!(S.days[dkey(t)]||{}).n)t--;while((S.days[dkey(t)]||{}).n){n++;t--}return n}
function hiTerm(s,t){if(!s)return'';const i=s.indexOf(t);if(i<0)return esc(s);return esc(s.slice(0,i))+'<mark>'+esc(t)+'</mark>'+esc(s.slice(i+t.length))}

/* ====================== 발음 ====================== */
function speak(text,lang){
  if(!('speechSynthesis' in window)){toast('이 기기는 소리 읽기를 지원하지 않아요');return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(lang==='ko'?text:(SAY[text]||text));
  u.lang=lang==='ko'?'ko-KR':'en-US';u.rate=lang==='ko'?1:S.set.rate;
  const v=speechSynthesis.getVoices().find(v=>v.lang===(lang==='ko'?'ko-KR':'en-US'));if(v)u.voice=v;
  speechSynthesis.speak(u);
}
/* 발음 반복 듣기: 횟수·간격·뜻 읽기 */
let SPK={active:false,id:null,i:0,n:0,tok:0,timer:null};
function utter(text,lang,cb){const u=new SpeechSynthesisUtterance(lang==='ko'?text:(SAY[text]||text));u.lang=lang==='ko'?'ko-KR':'en-US';u.rate=lang==='ko'?1:S.set.rate;const v=speechSynthesis.getVoices().find(v=>v.lang===u.lang);if(v)u.voice=v;let done=false;const fin=()=>{if(done)return;done=true;cb&&cb()};u.onend=fin;u.onerror=fin;setTimeout(fin,4500+String(text).length*140);speechSynthesis.speak(u)}
function sayWord(id,times){
  if(!('speechSynthesis' in window)){toast('이 기기는 소리 읽기를 지원하지 않아요');return}
  if(SPK.active&&SPK.id===id&&!times){stopSpeak();return}
  stopSpeak();const w=BYID[id];if(!w)return;const n=times||S.set.rep||1,tok=Math.random(),gap=(S.set.gap||0.8)*1000;
  SPK={active:true,id,i:0,n,tok,timer:null};
  const ok=()=>SPK.active&&SPK.tok===tok;
  const step=()=>{if(!ok())return;if(SPK.i>=n){stopSpeak();return}SPK.i++;updSay();
    utter(w.t,'en',()=>{if(!ok())return;if(S.set.repKo){SPK.timer=setTimeout(()=>{if(!ok())return;utter(w.k,'ko',()=>{if(ok())SPK.timer=setTimeout(step,gap)})},350)}else SPK.timer=setTimeout(step,gap)})};
  step();
}
function stopSpeak(){SPK.active=false;SPK.tok=0;clearTimeout(SPK.timer);try{speechSynthesis.cancel()}catch(e){}updSay()}
function updSay(){document.querySelectorAll('[data-say]').forEach(b=>{const on=SPK.active&&b.dataset.say===SPK.id;b.classList.toggle('on',on);b.innerHTML=on?`${ic('pause','s')}멈춤 ${SPK.i}/${SPK.n}`:`${ic('sound','s')}발음 ${S.set.rep}번`});document.querySelectorAll('.repsel').forEach(s=>{s.value=String(S.set.rep)})}
function sayBtn(id){return `<span class="saygrp noprint" onclick="event.stopPropagation()"><button class="speak" data-say="${esc(id)}" onclick="sayWord('${id}')" aria-label="발음 듣기">${ic('sound','s')}발음 ${S.set.rep}번</button><select class="repsel" aria-label="반복 횟수" onchange="S.set.rep=+this.value;save();updSay();sayWord('${id}',S.set.rep)">${[1,2,3,5,10].map(n=>`<option value="${n}" ${S.set.rep===n?'selected':''}>${n}번</option>`).join('')}</select></span>`}

const fmtDur=s=>{s=+s||0;if(!s)return'';const m=Math.floor(s/60),r=s%60;return m>=60?Math.floor(m/60)+':'+String(m%60).padStart(2,'0')+':'+String(r).padStart(2,'0'):m+':'+String(r).padStart(2,'0')};
const fmtView=v=>{v=+v||0;if(!v)return'';return v>=1e8?(v/1e8).toFixed(1).replace(/\.0$/,'')+'억회':v>=1e4?Math.round(v/1e4)+'만회':v>=1e3?(v/1e3).toFixed(1).replace(/\.0$/,'')+'천회':v+'회'};
function vidCard(v,i){const[id,t,c,d,views]=v;return `<a class="vid" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener" onclick="event.stopPropagation();watchXP('${id}')"><span class="th"><img loading="lazy" src="https://i.ytimg.com/vi/${id}/mqdefault.jpg" alt=""><i>${ic('play')}</i>${d?`<em>${fmtDur(d)}</em>`:''}</span><span class="tx">${i===0?'<span class="rk">추천 1순위</span>':''}<b>${esc(t)}</b><small>${esc(c)}${views?' · 조회 '+fmtView(views):''}</small></span></a>`}

function videoSec(w,open){const vs=(typeof YT!=='undefined'&&YT[w.id])||[];const q=encodeURIComponent(w.t+' 뜻 쉽게 설명');
  const body=`${vs.length?`<div class="vids">${vs.map(vidCard).join('')}</div>`:'<p class="sm faint" style="margin:4px 0 0">직접 추가한 단어는 아래에서 찾아 보세요.</p>'}<a class="more-yt" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${ic('search','s')}유튜브에서 더 찾기</a>`;

  return `<div class="grass">${h}</div><div class="glegend"><span style="margin-right:auto">공부한 날 ${active}일</span>적음 <i style="background:var(--surface2);border:1px solid var(--border)"></i><i style="background:#C7D7FB"></i><i style="background:#86A9F2"></i><i style="background:#3D6EDB"></i><i style="background:#1B3FA8"></i> 많음</div>`}
function badgeHTML(b){const got=S.badges[b.id];return `<div class="bdg ${got?'':'lock'}" style="--c:${b.c}"><div class="md">${ic(b.i)}</div><b>${b.n}</b><span>${got?dkey(Math.floor((got-new Date(got).getTimezoneOffset()*60000)/86400000)).slice(5).replace('-','/')+' 획득':b.d}</span></div>`}
function missionHTML(){return quests().map(m=>{const done=m.p>=m.t;return `<div class="mission ${done?'done':''}"><span class="chk">${done?ic('check','s'):''}</span><div class="tx"><b>${m.n}</b><small>${m.s} · ${m.p}/${m.t}</small><div class="pb"><i style="width:${pct(m.p,m.t)}%"></i></div></div><span class="rw">${done?'완료':'+'+m.xp+' XP'}</span></div>`}).join('')}

/* ====================== 타이머 ====================== */
let tStart=0,tAcc=0,tickId=null,running=false;
function timerStart(acc){tAcc=acc||0;tStart=performance.now();running=true;clearInterval(tickId);tickId=setInterval(tick,500);tick()}
function timerNow(){return tAcc+(running?(performance.now()-tStart)/1000:0)}
function timerPause(){if(running){tAcc=timerNow();running=false}}
function timerResume(){if(!running&&tickId){tStart=performance.now();running=true}}
function timerStop(){const t=timerNow();running=false;clearInterval(tickId);tickId=null;return t}
function tick(){const el=$('#timer b');if(!el)return;const t=timerNow();el.textContent=clock(t);$('#timer').classList.toggle('long',t>=SLOW_MAX)}
document.addEventListener('visibilitychange',()=>{if(document.hidden){timerPause();if(S.cur&&tickId){S.cur.acc=timerNow();save()}}else timerResume()});
function slowLimit(c){const ts=c.times||[];if(ts.length<3)return 12;const avg=ts.reduce((a,b)=>a+b,0)/ts.length;return Math.min(SLOW_MAX,Math.max(SLOW_MIN,avg*1.5))}

function guide(c){

  switch(s){
    case 0:return '카드를 넘기며 뜻, 쉬운 설명, 내 시스템 예시를 읽어요. 모르는 카드는 맞힐 때까지 몇 장 뒤에 다시 나와요.';

/* ====================== 문제 만들기 ====================== */
function opts(w,field){
  let pool=ALL.filter(x=>x.id!==w.id&&x[field]&&x[field]!==w[field]);
  const same=shuffle(pool.filter(x=>x.c===w.c)),other=shuffle(pool.filter(x=>x.c!==w.c));
  const pick=[];for(const x of same.concat(other)){if(pick.length>=3)break;if(!pick.some(p=>p[field]===x[field]))pick.push(x)}
  const all=shuffle([w,...pick]);return{o:all.map(x=>x[field]),a:all.indexOf(w)};
}
function makeQ(id,type){
  const w=BYID[id];if(!w)return null;
  if(type==='blank'&&!(w.s&&w.s.includes(w.t)))type='term';
  const q={id,type};
  if(type==='mean'){Object.assign(q,opts(w,'k'))}
  else if(type==='term'||type==='blank'){Object.assign(q,opts(w,'t'))}
  return q;
}
function mixType(id){
  const x=peek(id),w=BYID[id];
  const pool=['mean','term','blank','blank'];if(x.b>=2)pool.push('spell','recall');
  if(!(w.s&&w.s.includes(w.t)))return ['mean','term'][Math.floor(Math.random()*2)];
  return pool[Math.floor(Math.random()*pool.length)];
}
function newSession(o){return Object.assign({queue:[],done:0,idx:0,res:{},miss:{},graded:{},sel:null,shown:false,acc:0,times:[],ok:0,ng:0,sec:0,input:''},o)}
function startDaily(limit){
  const due=shuffle(dueList()).map(w=>w.id);
  const newLeft=Math.max(0,S.set.daily-todayNewDone());
  const nw=newList().slice(0,newLeft).map(w=>w.id);
  // 새 단어: 카드로 보고, 다음 카드 뒤에 확인 문제로 한 번 더 (클래스카드식 반복)
  const A=[];nw.forEach((id,i)=>{A.push({id,type:'card'});if(i>0)A.push(makeQ(nw[i-1],'mean'))});if(nw.length)A.push(makeQ(nw[nw.length-1],'term'));
  const B=due.map(id=>makeQ(id,mixType(id)));
  let q=[];while(A.length||B.length){q.push(...A.splice(0,2));if(B.length)q.push(B.shift())}
  q=q.filter(Boolean);
  if(limit){if(!q.length){q=shuffle(ALL.filter(w=>peek(w.id).b>0)).slice(0,limit).map(w=>makeQ(w.id,mixType(w.id)))}q=q.slice(0,limit)}
  if(!q.length){
    const extra=shuffle(ALL.filter(w=>peek(w.id).b>0)).slice(0,10).map(w=>makeQ(w.id,mixType(w.id)));
    if(!extra.length){toast('먼저 새 단어부터 익혀 볼까요?');return}
    q=extra;
  }
  S.cur=newSession({kind:'daily',queue:q});save();go({name:'study'});cheer('start');
}
function startFiltered(kind){
  let ws=[];
  if(kind==='wrong')ws=ALL.filter(w=>peek(w.id).ng>=2&&peek(w.id).b<5);
  if(kind==='star')ws=ALL.filter(w=>peek(w.id).st);
  if(kind==='talk')ws=ALL.filter(w=>w.s&&w.s.includes(w.t)&&(peek(w.id).b>0||w.c==='talk'));
  if(!ws.length){toast(kind==='wrong'?'아직 헷갈린 단어가 없어요':kind==='star'?'단어장에서 별표를 눌러 모아 보세요':'단어가 없어요');return}
  const q=shuffle(ws).slice(0,15).map(w=>makeQ(w.id,kind==='talk'?'blank':mixType(w.id)));
  S.cur=newSession({kind:'free',label:{wrong:'헷갈린 단어',star:'별표 단어',talk:'개발자 대화 빈칸'}[kind],queue:q});save();go({name:'study'});
}
function startMode(c,type){
  let ws=wordsOf(c);if(type==='blank')ws=ws.filter(w=>w.s&&w.s.includes(w.t));
  ws=shuffle(ws).sort((a,b)=>peek(a.id).b-peek(b.id).b).slice(0,type==='card'?ws.length:20);   // 덜 익힌 단어부터
  const q=shuffle(ws).map(w=>type==='card'||type==='recall'||type==='spell'?{id:w.id,type}:makeQ(w.id,type));
  const nm={card:'암기 카드',recall:'리콜',spell:'스펠',blank:'대화 빈칸',mean:'뜻 고르기'}[type];

function nextAction(c){
  const cs=catState(c);
  if(S.cur&&S.cur.cat===c&&['test','practice'].includes(S.cur.kind)){go({name:'study'});return}
  if(S.cur&&!confirm('진행 중인 학습이 있어요. 그만두고 새로 시작할까요?'))return;
  const ws=wordsOf(c).map(w=>w.id);
  if(cs.stage===0){S.cur=newSession({kind:'card',cat:c,label:catOf(c).name+' · 암기',queue:shuffle(ws).map(id=>({id,type:'card'}))})}
  else if(cs.stage===1||cs.stage===3||cs.stage===5){
    const r=(cs.stage-1)/2;const ids=r===0?ws:cs.r[r-1].pool;
    S.cur=newSession({kind:'test',cat:c,r,label:catOf(c).name+' · '+(r+1)+'차 시험',queue:shuffle(ids).map(id=>makeQ(id,['mean','mean','term','blank'][Math.floor(Math.random()*4)]))});
  }else if(cs.stage===2||cs.stage===4){
    const r=(cs.stage-2)/2;
    S.cur=newSession({kind:'practice',cat:c,r,label:catOf(c).name+' · '+(r+1)+'차 연습',queue:shuffle(cs.r[r].pool).map(id=>makeQ(id,mixType(id)==='spell'?'spell':['mean','term','blank'][Math.floor(Math.random()*3)]))});
  }else{go({name:'report'});return}
  save();go({name:'study'});
}

function Study(){
  const c=S.cur;if(!c||!c.queue.length){return finishStudy()}
  const q=c.queue[0],w=BYID[q.id];
  if(!w){c.queue.shift();save();return Study()}
  const total=c.done+c.queue.length;
  const top=`<div class="s-top"><button class="iconbtn" onclick="pauseStudy()" aria-label="멈추기" title="멈추기">${ic('x')}</button><div class="tt"><b>${esc(sessionName(c))}</b><span>${c.done+1} / ${total}${c.kind==='test'?' · 시험 모드':''}</span></div>${(c.run||0)>=2&&c.kind!=='test'?`<span class="combo pop">${ic('flame','s')}${c.run}콤보</span>`:''}<span class="timer" id="timer">${ic('clock','s')}<b>00:00</b></span></div>
  <div class="prog"><i style="width:${pct(c.done,total)}%"></i></div>`;
  let body='';
  if(q.type==='card')body=CardView(c,q,w);
  else if(q.type==='recall')body=RecallView(c,q,w);
  else if(q.type==='spell')body=SpellView(c,q,w);
  else body=ChoiceView(c,q,w);
  return `<div class="study">${top}<div class="tags">${reasonTags(c,q)}</div>${body}</div>`;
}
function reasonTags(c,q){
  const x=peek(q.id),w=BYID[q.id];let t=`<span class="badge cat" style="--c:${cs_(w.c).c}">${esc(catOf(w.c).name)}</span>`;

  else if(x.b===0&&!x.fs)t+='<span class="badge p">새 단어</span>';
  else if(x.ng>=2&&x.b<3)t+='<span class="badge bad">자주 헷갈린 단어</span>';
  if(c.kind==='practice'&&!c.miss[q.id]){const r=catState(c.cat).r[c.r];const rr=r&&r.res[q.id];if(rr)t+=(rr.ok?'':'<span class="badge bad">시험에서 틀림</span>')+(rr.slow?`<span class="badge warn">${fmt(rr.t)} 고민</span>`:'')}
  return t;
}

function record(ok,t,qq){
  const c=S.cur,q=qq||c.queue[0],lim=slowLimit(c),slow=ok&&t>lim;
  c.times.push(t);c.sec+=t;
  const first=!c.graded[q.id];c.graded[q.id]=1;
  if(c.kind!=='test')grade(q.id,ok,slow,first&&!c.miss[q.id]);
  else{if(!ok)grade(q.id,false);else st(q.id).ok++}
  if(ok&&first)c.ok++;if(!ok)c.ng++;
  if(c.kind!=='test'){if(ok){c.run=(c.run||0)+1;if(c.run===3)cheer('s3');else if(c.run===5)cheer('s5');else if(c.run===10)cheer('s10')}else{c.run=0;cheer('wrong')}}
  // XP·카운터 (배지·미션용)
  if(ok){const bonus=c.kind!=='test'&&(c.run||0)>=5?5:0;addXP((slow?6:10)+bonus,c.kind!=='test');if(q.type==='blank'){S.cnt.blank=(S.cnt.blank||0)+1;qday().bl++}if(q.type==='spell')S.cnt.spell=(S.cnt.spell||0)+1}else addXP(2);

  <label class="f">내 시스템에서는</label><textarea class="inp" id="fmy">${esc(w.my)}</textarea>
  <label class="f">개발자 문장 (영어 단어가 문장 안에 그대로 있어야 빈칸 문제로 나와요)</label><textarea class="inp" id="fs">${esc(w.s)}</textarea>
  <div class="two"><button class="btn sec" onclick="closeModal()">취소</button><button class="btn" onclick="saveWord('${id||''}')">저장</button></div></div>`;
  document.body.appendChild(d);
}
function saveWord(id){
  const g=k=>($('#f'+k).value||'').trim();
  const o={c:g('c'),p:g('p'),k:g('k'),d:g('d'),my:g('my'),s:g('s')};
  if(!id||!BYID[id].base)o.t=g('t');
  if((!id||!BYID[id].base)&&!o.t){toast('영어 단어를 입력해 주세요');return}
  if(!o.k){toast('한 줄 뜻을 입력해 주세요');return}
  if(id&&BYID[id].base){S.edit[id]=o}
  else if(id){const i=S.custom.findIndex(x=>x.id===id);S.custom[i]=Object.assign(S.custom[i],o)}
  else{if(ALL.some(w=>w.t.toLowerCase()===o.t.toLowerCase())){toast('이미 있는 단어예요');return}S.custom.push(Object.assign({id:'u'+Date.now(),lv:1},o))}
  save();buildWords();closeModal();toast('저장했어요');render();
}
function delWord(id){
  const w=BYID[id];
  if(!confirm(w.base?`"${w.t}"를 단어장에서 숨길까요? 설정에서 다시 보이게 할 수 있어요.`:`"${w.t}"를 삭제할까요?`))return;
  if(w.base)S.hide[id]=1;else S.custom=S.custom.filter(x=>x.id!==id);
  save();buildWords();closeModal();render();
}

/* ====================== 보고서 ====================== */
let REPORT_TXT='';
function Report(){
  const total=ALL.length,lv=[0,0,0,0];ALL.forEach(w=>lv[level(peek(w.id).b)]++);
  const t=today(),days=[];for(let i=13;i>=0;i--){const k=dkey(t-i);days.push({k,n:(S.days[k]||{}).n||0})}
  const maxN=Math.max(5,...days.map(d=>d.n));
  const allDays=Object.values(S.days);const sumN=allDays.reduce((a,d)=>a+d.n,0),sumOk=allDays.reduce((a,d)=>a+d.ok,0),sumSec=allDays.reduce((a,d)=>a+d.sec,0);
  const cats=CATS.map(c=>{const ws=wordsOf(c.id);const got=ws.filter(w=>peek(w.id).b>=5).length;const seen=ws.filter(w=>peek(w.id).ok+peek(w.id).ng>0);const ok=seen.reduce((a,w)=>a+peek(w.id).ok,0),ng=seen.reduce((a,w)=>a+peek(w.id).ng,0);const r1=(S.rounds[c.id]||{r:[]}).r[0];return{c,n:ws.length,got,acc:ok+ng?ok/(ok+ng):null,r1,seen:seen.length}}).filter(x=>x.n);
  const confused=ALL.filter(w=>peek(w.id).ng>=2).sort((a,b)=>peek(b.id).ng-peek(a.id).ng||peek(a.id).b-peek(b.id).b).slice(0,10);
  const slow=ALL.filter(w=>peek(w.id).t>=SLOW_MIN&&peek(w.id).b<5).sort((a,b)=>peek(b.id).t-peek(a.id).t).slice(0,10);
  const started=ALL.filter(w=>peek(w.id).fs).length;
  const mastery=(lv[2]*0.6+lv[3])/Math.max(total,1);
  const overall=!started?'아직 시작 전이에요':mastery>=0.7?'개발자 회의를 거의 따라갈 수 있어요':mastery>=0.4?'자주 나오는 용어는 익숙해졌어요':mastery>=0.15?'기초를 쌓는 중이에요':'첫걸음을 뗐어요';
  const weak=cats.filter(x=>x.seen).sort((a,b)=>(a.got/a.n)-(b.got/b.n))[0];
  const untouched=cats.filter(x=>!x.seen);
  const plan=[];
  const due=dueList().length;
  if(due)plan.push(`오늘 복습할 단어가 <b>${due}개</b> 있어요. 미루면 다음 날 한꺼번에 몰려요.`);
  if(weak&&weak.got<weak.n)plan.push(`<b>${esc(weak.c.name)}</b> 분야의 익힘이 가장 낮아요 (${pct(weak.got,weak.n)}%). 분야 화면에서 다음 차수를 이어 가세요.`);
  if(untouched.length)plan.push(`아직 시작하지 않은 분야: ${untouched.map(x=>esc(x.c.name)).join(', ')}. 개발자와 만날 일이 있다면 <b>개발자 회의 말</b>부터 추천해요.`);
  if(confused.length)plan.push(`끝까지 헷갈리는 단어 ${confused.length}개는 "내 시스템에서는" 예시를 소리 내어 읽어 보세요. 내 업무와 연결되면 오래 기억돼요.`);
  const dn=ddayN();if(dn>0)plan.push(`개발자 미팅까지 ${dn}일 남았어요. 새 단어 ${lv[0]}개를 모두 보려면 하루 ${Math.ceil(lv[0]/dn)}개씩이에요. 설정의 "하루 새 단어 수"를 맞춰 두세요.`);
  if(!plan.length)plan.push('지금처럼 하루 한 번 "오늘의 학습"만 해도 충분해요.');
  REPORT_TXT=`[짬짬이 IT 영단어] ${dkey(t)}\n상태: ${overall}\n내 말 됐음 ${lv[3]}/${total} · 거의 익힘 ${lv[2]} · 익히는 중 ${lv[1]}\n푼 문제 ${sumN}개 · 정답률 ${pct(sumOk,sumN)}% · 연속 ${streak()}일\n헷갈린 단어: ${confused.slice(0,5).map(w=>w.t).join(', ')||'없음'}`;
  const LI=lvInfo();
  return `<header class="ph"><div><div class="eyebrow">성장 기록 · ${dkey(t)}</div><h1>${overall}</h1><p>시작한 단어 ${started} / ${total}</p></div>
    <div class="act noprint"><button class="btn sec sm" onclick="shareReport()">${ic('share','s')}공유</button><button class="btn sec sm" onclick="window.print()">${ic('print','s')}인쇄</button></div></header>
  <section class="card"><div class="lvbig"><div class="md">Lv.${LI.l+1}</div><div style="flex:1;min-width:0"><div class="sm faint">나의 IT 대화 레벨</div><div style="font-size:24px;font-weight:800;letter-spacing:-.03em">${LI.title}</div>
    <div class="pbar"><i style="width:${LI.p}%"></i></div><div class="sm muted" style="margin-top:8px">${S.xp} XP${LI.next?` · 「${LI.nextTitle}」까지 ${LI.toNext} XP`:' · 최고 레벨'}</div></div></div>
    <div class="ladder">${TITLE.map((n,i)=>`<span class="${i===LI.l?'on':i<LI.l?'done':''}">${i+1}. ${n}</span>`).join('')}</div>
    <p class="xs faint" style="margin:14px 0 0">XP 얻는 법: 정답 10 · 5콤보 이상 +5 · 학습 완료 30 · 미션 50 · 배지 50 · 시험 만점 100</p></section>
  <section class="card"><div class="card-h"><h3>배지</h3><span class="sub r">${Object.keys(S.badges).length} / ${BADGES.length} 획득</span></div><div class="badges">${BADGES.map(badgeHTML).join('')}</div></section>
  <section class="card"><div class="card-h"><h3>학습 잔디</h3><span class="sub r">최근 26주</span></div>${grassHTML(26)}</section>
  <section class="kpis">
    <div class="kpi"><div class="h"><span class="ico" style="--c:#2563EB">${ic('target','s')}</span>푼 문제</div><div class="v">${sumN}</div><div class="f">누적</div></div>
    <div class="kpi"><div class="h"><span class="ico" style="--c:#10B981">${ic('checkc','s')}</span>정답률</div><div class="v">${sumN?pct(sumOk,sumN):'–'}<small>${sumN?'%':''}</small></div><div class="f">맞힘 ${sumOk}</div></div>
    <div class="kpi"><div class="h"><span class="ico" style="--c:#7C3AED">${ic('clock','s')}</span>공부 시간</div><div class="v" style="font-size:22px">${fmt(sumSec)}</div><div class="f">누적</div></div>
    <div class="kpi"><div class="h"><span class="ico" style="--c:#F97316">${ic('flame','s')}</span>연속 학습</div><div class="v">${streak()}<small>일</small></div><div class="f">오늘 포함</div></div>
  </section>
  <div class="cols">
    <section class="card"><div class="card-h"><h3>단계별 분포</h3></div><div class="bar">${lv.map((n,i)=>`<i style="width:${pct(n,total)}%;background:${LV[i].c}"></i>`).join('')}</div>
      <div class="legend">${LV.map((x,i)=>`<div><i style="background:${x.c}"></i>${x.n}<b>${lv[i]}</b></div>`).join('')}</div></section>
    <section class="card"><div class="card-h"><h3>앞으로 할 일</h3></div><ul class="todo">${plan.map(p=>`<li>${ic('checkc','s')}<span>${p}</span></li>`).join('')}</ul></section>
  </div>
  <section class="card"><div class="card-h"><h3>최근 14일 학습량</h3><span class="sub r">하루 푼 문제 수</span></div><div class="chart">${days.map(d=>`<div title="${d.k} ${d.n}개"><i class="${d.n?'':'z'}" style="height:${Math.max(2,Math.round(d.n/maxN*100))}%"></i><span>${+d.k.slice(8)}</span></div>`).join('')}</div></section>
  <section class="card"><div class="card-h"><h3>분야별 성과</h3></div><div class="tblwrap"><table><tr><th>분야</th><th class="num">단어</th><th class="num">내 말 됐음</th><th class="num">정답률</th><th class="num">1차 시험</th></tr>
    ${cats.map(x=>`<tr><td><span class="row" style="gap:8px;flex-wrap:nowrap"><span class="dot" style="background:${cs_(x.c.id).c}"></span>${esc(x.c.name)}</span></td><td class="num">${x.n}</td><td class="num">${x.got} (${pct(x.got,x.n)}%)</td><td class="num">${x.acc==null?'–':Math.round(x.acc*100)+'%'}</td><td class="num">${x.r1?pct(x.r1.ok,x.r1.n)+'%':'–'}</td></tr>`).join('')}</table></div></section>
  <div class="cols">
    <section class="card"><div class="card-h"><h3>끝까지 헷갈린 단어</h3></div>${confused.length?`<div class="tblwrap"><table><tr><th>단어</th><th>뜻</th><th class="num">틀림</th></tr>${confused.map(w=>`<tr onclick="openWord('${w.id}')" style="cursor:pointer"><td><b>${esc(w.t)}</b></td><td>${esc(w.k)}</td><td class="num">${peek(w.id).ng}</td></tr>`).join('')}</table></div>`:'<div class="empty">아직 없어요</div>'}</section>
    <section class="card"><div class="card-h"><h3>가장 오래 고민한 단어</h3></div>${slow.length?`<div class="tblwrap"><table><tr><th>단어</th><th>뜻</th><th class="num">시간</th></tr>${slow.map(w=>`<tr onclick="openWord('${w.id}')" style="cursor:pointer"><td><b>${esc(w.t)}</b></td><td>${esc(w.k)}</td><td class="num">${fmt(peek(w.id).t)}</td></tr>`).join('')}</table></div>`:'<div class="empty">아직 없어요</div>'}</section>
  </div>`;
}
function shareReport(){
  if(navigator.share){navigator.share({title:'IT 영단어 학습 보고서',text:REPORT_TXT}).catch(()=>{});return}
  (navigator.clipboard?navigator.clipboard.writeText(REPORT_TXT):Promise.reject()).then(()=>toast('요약을 복사했어요. 카톡에 붙여 넣으세요')).catch(()=>prompt('아래 내용을 복사하세요',REPORT_TXT));
}

/* ====================== 설정 ====================== */
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(view.name==='settings')render()});
function srow(t,s,ctrl){return `<div class="srow"><div class="tx"><b>${t}</b>${s?`<span>${s}</span>`:''}</div>${ctrl}</div>`}
function Settings(){
  const hidden=Object.keys(S.hide).length;
  const sel=(opts,cur,fn)=>`<select onchange="${fn}">${opts.map(([v,n])=>`<option value="${v}" ${String(cur)===String(v)?'selected':''}>${n}</option>`).join('')}</select>`;
  return `<header class="ph"><div><div class="eyebrow">설정</div><h1>학습 환경</h1><p>하루 분량, 소리, 화면, 학습 기록을 관리해요.</p></div></header>
  <section class="group"><h4>학습</h4>
    ${srow('하루 새 단어 수','오늘의 학습에 섞이는 새 단어',sel([3,5,8,10,15,20].map(n=>[n,n+'개']),S.set.daily,'S.set.daily=+this.value;save()'))}
    ${srow('하루 목표 문제 수','홈의 목표 링에 반영',sel([10,20,30,50].map(n=>[n,n+'문제']),S.set.goal,'S.set.goal=+this.value;save()'))}
    ${srow('먼저 배울 분야','새 단어를 이 분야부터',sel([['','순서대로'],...CATS.map(c=>[c.id,c.name])],S.set.focus,'S.set.focus=this.value;save()'))}
    ${srow('개발자 미팅일','홈에 D-day 표시',`<input type="date" value="${esc(S.set.meet)}" onchange="S.set.meet=this.value;save()">`)}
  </section>
  <section class="group"><h4>소리 · 화면</h4>
    ${srow('발음 자동 재생','카드가 나오면 바로 읽기',`<label class="switch"><input type="checkbox" ${S.set.auto?'checked':''} onchange="S.set.auto=this.checked;save()"><i></i></label>`)}
    ${srow('발음 반복 횟수','발음 버튼을 누르면 이만큼 반복',sel([1,2,3,5,10].map(n=>[n,n+'번']),S.set.rep,'S.set.rep=+this.value;save()'))}
    ${srow('반복 사이 쉬는 시간','따라 말해 볼 시간',sel([[0.5,'짧게'],[0.8,'보통'],[1.5,'길게'],[2.5,'아주 길게']],S.set.gap,'S.set.gap=+this.value;save()'))}
    ${srow('영어 뒤에 뜻도 읽기','예: "deploy" → "만든 것을 실제로 쓰게 올리는 것"',`<label class="switch"><input type="checkbox" ${S.set.repKo?'checked':''} onchange="S.set.repKo=this.checked;save()"><i></i></label>`)}
    ${srow('발음 들어 보기','지금 설정으로 deploy 재생',`<button class="btn sec sm" onclick="sayWord('deploy')">${ic('sound','s')}듣기</button>`)}
    ${srow('발음 속도','',sel([[0.7,'천천히'],[0.9,'보통'],[1.1,'빠르게']],S.set.rate,"S.set.rate=+this.value;save();speak('deploy')"))}
    ${srow('글자 크기','화면 전체를 더 크게',sel([['m','기본 (크게)'],['l','더 크게'],['xl','아주 크게']],S.set.fs,'S.set.fs=this.value;save();render()'))}
    ${srow('화면 테마','',sel([['auto','기기 설정 따라'],['light','라이트'],['dark','다크']],S.set.theme,'S.set.theme=this.value;save();render()'))}
  </section>
  <section class="group"><h4>앱 설치</h4>
    ${installEvt?srow('이 기기에 설치','홈 화면 아이콘으로 바로 열기',`<button class="btn sm" onclick="installEvt.prompt();installEvt=null">설치</button>`):''}
    ${srow('안드로이드 (크롬)','오른쪽 위 ⋮ → 홈 화면에 추가 또는 앱 설치','')}
    ${srow('아이폰 · 아이패드 (사파리)','공유 버튼 → 홈 화면에 추가','')}
  </section>
  <section class="group"><h4>학습 기록</h4>
    ${srow('파일로 내보내기','다른 기기로 옮기거나 보관할 때',`<button class="btn sec sm" onclick="exportData()">${ic('down','s')}내보내기</button>`)}
    ${srow('파일 불러오기','내보낸 기록으로 이어서 학습',`<button class="btn sec sm" onclick="$('#imp').click()">${ic('up','s')}불러오기</button>`)}
    ${hidden?srow('숨긴 단어 '+hidden+'개','단어장에 다시 보이기',`<button class="btn sec sm" onclick="if(confirm('숨긴 단어를 다시 보이게 할까요?')){S.hide={};save();buildWords();render()}">복원</button>`):''}
    ${srow('<span style="color:var(--bad)">모든 기록 초기화</span>','되돌릴 수 없어요',`<button class="btn sec sm" style="color:var(--bad)" onclick="resetAll()">초기화</button>`)}
    <input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importData(this.files[0])">
  </section>
  <p class="xs faint" style="text-align:center">짬짬이 IT 영단어 ${VERSION} · 단어 ${ALL.length}개 · 기록은 이 기기에만 저장돼요</p>`;
}
function exportData(){
  const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='IT영단어_학습기록_'+dkey(today()).replace(/-/g,'')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importData(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.w||!x.set)throw 0;if(!confirm('불러온 기록으로 바꿀까요? 지금 이 기기의 기록은 덮어써져요.'))return;localStorage.setItem(KEY,JSON.stringify(x));load();buildWords();toast('불러왔어요');go({name:'home'})}catch(e){toast('학습 기록 파일이 아니에요')}};
  r.readAsText(f);
}
function resetAll(){if(confirm('모든 학습 기록을 지울까요? 되돌릴 수 없어요. 필요하면 먼저 "내보내기"를 하세요.')){const keep=S.custom;S=blank();S.custom=keep;save();buildWords();go({name:'home'})}}

/* ====================== 키보드 (PC) ====================== */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('.modal')){closeModal();return}
  if(view.name!=='study'||!S.cur||!S.cur.queue.length)return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  const c=S.cur,q=c.queue[0];
  if(q.type==='card'){if(e.key===' '){e.preventDefault();flip()}if(e.key==='ArrowLeft')answerCard(false);if(e.key==='ArrowRight')answerCard(true);return}
  const k=e.key.toUpperCase();const idx='1234'.indexOf(e.key)>=0?'1234'.indexOf(e.key):KEYS.indexOf(k);
  if(q.o&&!c.shown&&idx>=0){pick(idx);return}
  if(e.key==='Enter'){if(c.kind==='test'&&c.sel!=null)confirmTest();else if(c.shown&&$('#nextBtn'))nextQ()}
});

/* ====================== 시작 ====================== */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});   // 기록이 지워지지 않게 요청
if(window.top!==window.self)setTimeout(()=>toast('다른 화면 안에서 열렸어요. 기록 보호를 위해 주소를 직접 열어 주세요'),800);
try{const mq=matchMedia('(prefers-color-scheme: dark)'),f=()=>{if(S.set.theme==='auto')render()};if(mq.addEventListener)mq.addEventListener('change',f);else if(mq.addListener)mq.addListener(f)}catch(e){}
render();window.__appOk=true;
</script>
