<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24305E">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IT 영단어">
<title>짬짬이 IT 영단어</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#FBFBF8;--grid:#E4E8EF;--ink:#24305E;--ink2:#5B6585;--line:#CBD2E0;
  --lime:#C9EA6A;--yellow:#FFE45C;--sky:#A8DCF0;--pink:#F6C1D6;
  --ok:#2F8F5B;--okbg:#E5F4EA;--bad:#D2454B;--badbg:#FBE6E7;--warn:#B7791F;--warnbg:#FFF4D6;
  --card:#FFFFFF;--hl:#FFE45C;
  --hand:'Nanum Pen Script','Apple SD Gothic Neo',cursive;
  --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
html[data-theme="dark"]{
  --paper:#1A1E29;--grid:#262C3B;--ink:#E7EAF3;--ink2:#A4ACC4;--line:#3A4258;
  --lime:#7E9A2E;--yellow:#9C8A1F;--sky:#2F6F88;--pink:#8A4A63;
  --ok:#5CC48A;--okbg:#1F3A2C;--bad:#F07A7F;--badbg:#432428;--warn:#E3B04B;--warnbg:#3D3220;--card:#222838;
}
html[data-theme="dark"] .hl,html[data-theme="dark"] .catbtn .name span{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--hl) 40%,transparent) 55%)}
html[data-theme="dark"] mark{background:linear-gradient(transparent 50%,color-mix(in srgb,#FFE45C 40%,transparent) 50%)}
html[data-theme="dark"] .tag.cat{background:color-mix(in srgb,var(--hlc,#FFE45C) 35%,transparent);color:var(--ink)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;line-height:1.55;-webkit-text-size-adjust:100%;font-size:16px}
#app{max-width:760px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.hand{font-family:var(--hand);font-weight:400}
h1.hand{font-size:40px;margin:6px 0 2px;line-height:1.15}
h2.hand{font-size:32px;margin:8px 0 6px;line-height:1.15}
h3{font-size:16px;margin:0 0 8px}
.hl{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 4px}
.sub{color:var(--ink2);font-size:14px;margin:0 0 12px}
.sheet{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 0 var(--line)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 16px;font-weight:700;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:6px 10px;font-size:14px;border-radius:10px;border-width:1.5px}
.btn.block{display:block;width:100%;margin-top:10px}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.badb{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.linkbtn{background:none;border:none;color:var(--ink2);padding:6px 0;font-size:15px}
.muted{color:var(--ink2)}
.small{font-size:13px}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:2px 8px;margin:0 4px 4px 0;border:1px solid var(--line);color:var(--ink2)}
.tag.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.tag.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.tag.slow{background:var(--warnbg);color:var(--warn);border-color:transparent}
.tag.cat{background:var(--hlc,var(--yellow));color:#24305E;border-color:transparent}
/* 홈 */
.today{border:2px solid var(--ink);background:var(--card);border-radius:18px;padding:18px;margin:14px 0}
.today .big{font-size:22px;font-weight:700;margin:0 0 4px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--ink2)}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.quick button{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:left}
.quick button b{display:block;font-size:15px}
.quick button span{font-size:12px;color:var(--ink2)}
.bar{height:12px;border-radius:999px;background:var(--grid);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.dday{display:flex;align-items:center;gap:8px}
.dday .count{font-family:var(--hand);font-size:30px}
.phrase{font-size:17px;line-height:1.7}
mark{background:linear-gradient(transparent 50%,var(--hl) 50%);color:inherit;padding:0 2px;font-weight:700}
/* 분야 */
.cats{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:620px){.cats{grid-template-columns:1fr 1fr}}
.catbtn{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;text-align:left;position:relative}
.catbtn .name{font-family:var(--hand);font-size:28px;line-height:1.1}
.catbtn .name span{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 4px}
.catbtn .next{font-size:14px;font-weight:700;margin:6px 0}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.step{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--ink2)}
.step.done{background:var(--okbg);color:var(--ok);border-color:transparent}
.step.now{border-color:var(--ink);color:var(--ink);font-weight:700}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.modes button{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:left}
.modes button b{display:block}
.modes button span{font-size:12px;color:var(--ink2)}
/* 학습 */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.topbar .title{font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;background:var(--card)}
.timer.long{color:var(--warn);border-color:var(--warn)}
.prog{height:6px;background:var(--grid);border-radius:99px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--ink)}
.flash{background:var(--card);border:2px solid var(--ink);border-radius:20px;min-height:260px;padding:22px;display:flex;flex-direction:column;justify-content:center;text-align:center;position:relative;user-select:none}
.flash .term{font-size:36px;font-weight:700;letter-spacing:.2px;word-break:break-word}
.flash .pron{color:var(--ink2);margin-top:4px}
.flash .hint{position:absolute;bottom:10px;left:0;right:0;font-size:12px;color:var(--ink2)}
.speak{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:14px;margin:8px auto 0;display:inline-flex;align-items:center;gap:6px}
.back{text-align:left}
.back .k{font-size:22px;font-weight:700;margin-bottom:8px}
.box{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px}
.box .lb{font-size:12px;font-weight:700;color:var(--ink2);display:block;margin-bottom:2px}
.box.d{background:var(--paper);border:1px dashed var(--line)}
.box.my{background:var(--warnbg)}
.box.s{background:var(--okbg)}
.prompt{font-size:20px;font-weight:700;margin:6px 0 4px;line-height:1.5}
.prompt.term{font-size:32px}
.qtype{font-size:12px;color:var(--ink2);font-weight:700;letter-spacing:.5px}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px}
.opt .n{font-weight:700;color:var(--ink2);min-width:18px}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default;opacity:1}
.feedback{border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:700}
.feedback.ok{background:var(--okbg);color:var(--ok)}
.feedback.bad{background:var(--badbg);color:var(--bad)}
.spellin{width:100%;font-size:22px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);text-align:center}
.spellin:focus{outline:none;border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{min-height:72px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px;font-size:14px;display:flex;align-items:center;justify-content:center;text-align:center}
.tile.t{font-weight:700;font-size:16px}
.tile.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tile.gone{visibility:hidden}
.tile.no{background:var(--badbg);border-color:var(--bad)}
/* 단어장 */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.wlist{list-style:none;padding:0;margin:0}
.wlist li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.wlist .t{font-weight:700}
.wlist .k{font-size:13px;color:var(--ink2)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.star{background:none;border:none;font-size:20px;line-height:1;padding:4px;color:var(--line)}
.star.on{color:#E8B400}
/* 표 */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--ink2);font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.chart{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:6px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.chart i{display:block;width:100%;background:var(--ink);border-radius:4px 4px 0 0;min-height:2px}
.chart span{font-size:10px;color:var(--ink2);margin-top:3px}
.status{font-family:var(--hand);font-size:30px;line-height:1.2}
ul.todo{padding-left:20px;margin:6px 0}
ul.todo li{margin-bottom:6px}
/* 하단 메뉴 */
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.bottom .in{display:flex;max-width:760px;width:100%}
nav.bottom button{flex:1;background:none;border:none;padding:8px 0 10px;font-size:12px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bottom button.on{color:var(--ink);font-weight:700}
nav.bottom svg{width:24px;height:24px}
/* 모달 */
.modal{position:fixed;inset:0;background:rgba(20,24,40,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .panel{background:var(--paper);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
@media(min-width:760px){.modal{align-items:center}.modal .panel{border-radius:20px}}
label.f{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin:10px 0 4px}
.inp{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:15px}
textarea.inp{min-height:64px;resize:vertical}
.cheer{position:fixed;left:50%;top:14px;transform:translate(-50%,-140%);background:var(--card);border:2px solid var(--ink);color:var(--ink);padding:10px 18px;border-radius:999px;font-size:16px;font-weight:700;z-index:70;transition:transform .35s ease;white-space:nowrap;box-shadow:0 4px 0 var(--line)}
.cheer.on{transform:translate(-50%,0)}
.btn{min-height:48px}.btn.small{min-height:0}.opt{min-height:54px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90%}
.printonly{display:none}
@media print{
  @page{size:A4;margin:14mm 12mm}
  body{background:#fff;color:#000;font-size:11pt}
  nav.bottom,.noprint,.toast{display:none!important}
  #app{max-width:none;padding:0}
  .sheet{break-inside:avoid;box-shadow:none;border-color:#999}
  .printonly{display:block}
  tr{break-inside:avoid}
  :root,html[data-theme="dark"]{--paper:#fff;--card:#fff;--ink:#000;--ink2:#444;--line:#999;--grid:#eee}
}
</style>
</head>
<body>
<div id="app"><noscript><p style="padding:20px">이 화면은 미리보기에서는 열리지 않아요. 크롬이나 사파리에서 주소를 열어 주세요.</p></noscript></div>
<nav class="bottom noprint" id="nav"></nav>
<script src="words.js"></script>
<script>
/* ====================== 기본 설정 ====================== */
const KEY='itword.v1';
const INT=[0,1,2,4,7,15,30];                 // 단계별 다음 복습까지 날짜
const STEPS=['암기','1차','연습','2차','연습','3차','끝'];
const SLOW_MIN=6,SLOW_MAX=20;
const NUM=['①','②','③','④'];
const SAY={'sw.js':'S W dot J S','2FA':'two F A','SHA-256':'SHA two fifty six','JSON':'jason','OAuth':'oh auth','SaaS':'sass','ESP32':'E S P thirty two','AAB':'A A B','APK':'A P K','TWA':'T W A','PWA':'P W A','POP3':'pop three','OAPI':'open A P I','CRUD':'crud','LOT':'lot','UI':'U I','UX':'U X','DB':'D B','DX':'D X','AX':'A X','LLM':'L L M','RPA':'R P A','OCR':'O C R','QA':'Q A','MVP':'M V P','IoT':'I o T','repo':'reepo','Node.js':'node J S','URL':'U R L','API':'A P I','API key':'A P I key','CSS':'C S S','HTML':'H T M L','HTTPS':'H T T P S','CSV':'C S V','ID':'I D','AI':'A I'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)};
const dkey=n=>{const d=new Date(n*86400000);return d.toISOString().slice(0,10)};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=s=>{s=Math.round(s||0);return s<60?s+'초':Math.floor(s/60)+'분 '+(s%60)+'초'};
const clock=s=>{s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const pct=(a,b)=>b?Math.round(a/b*100):0;
const idOf=w=>w.id||w.t.toLowerCase();

/* ====================== 저장 ====================== */
let S;
function blank(){return{w:{},days:{},set:{daily:5,goal:20,auto:false,rate:0.9,theme:'auto',meet:'',focus:''},custom:[],edit:{},hide:{},rounds:{},best:{},cur:null,created:Date.now()}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){S=blank()}const b=blank();for(const k in b)if(S[k]==null)S[k]=b[k];for(const k in b.set)if(S.set[k]==null)S.set[k]=b.set[k]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('저장 공간이 부족해요. 설정에서 기록을 내보내 주세요.')}}
load();

/* ====================== 단어 ====================== */
let ALL=[],BYID={};
function buildWords(){
  ALL=[];BYID={};
  WORDS.forEach(w=>{const id=idOf(w);if(S.hide[id])return;const x=Object.assign({},w,S.edit[id]||{},{id,base:true});ALL.push(x);BYID[id]=x});
  S.custom.forEach(w=>{if(S.hide[w.id])return;const x=Object.assign({lv:1,p:'',d:'',my:'',s:''},w,{base:false});ALL.push(x);BYID[w.id]=x});
}
buildWords();
const st=id=>S.w[id]||(S.w[id]={b:0,due:0,ok:0,ng:0,sl:0,t:0,st:0,fs:0});
const peek=id=>S.w[id]||{b:0,due:0,ok:0,ng:0,sl:0,t:0,st:0,fs:0};
const catOf=id=>CATS.find(c=>c.id===id)||{id,name:id,hl:'#FFE45C'};
const wordsOf=c=>ALL.filter(w=>w.c===c);
function level(b){return b===0?0:b<=2?1:b<=4?2:3}
const LV=[{n:'새 단어',c:'var(--line)'},{n:'익히는 중',c:'#F2A65A'},{n:'거의 익힘',c:'#7FB3D5'},{n:'내 말 됐음',c:'#4CAF7A'}];
function isDue(id){const x=peek(id);return x.b>0&&x.due<=today()}
function grade(id,ok,slow,first){
  const x=st(id),t=today();if(!x.fs)x.fs=t;
  if(!ok){x.b=1;x.due=t;x.ng++;return}
  x.ok++;if(slow)x.sl++;
  if(!first){if(x.due<=t)x.due=t+1;return}   // 틀렸다가 다시 맞힌 단어는 내일 다시 (단계는 안 올림)
  if(slow){x.b=Math.max(1,x.b);x.due=t+1}
  else{x.b=Math.min(6,x.b+1);x.due=t+INT[x.b]}
}
function logDay(n,ok,ng,sec){const k=dkey(today());const d=S.days[k]||(S.days[k]={n:0,ok:0,ng:0,sec:0});d.n+=n;d.ok+=ok;d.ng+=ng;d.sec+=Math.round(sec||0)}
function streak(){let n=0,t=today();if(!(S.days[dkey(t)]||{}).n)t--;while((S.days[dkey(t)]||{}).n){n++;t--}return n}
function hiTerm(s,t){if(!s)return'';const i=s.indexOf(t);if(i<0)return esc(s);return esc(s.slice(0,i))+'<mark>'+esc(t)+'</mark>'+esc(s.slice(i+t.length))}
function blankTerm(s,t){const i=s.indexOf(t);return esc(s.slice(0,i))+'<b style="letter-spacing:2px">＿＿＿＿</b>'+esc(s.slice(i+t.length))}
const norm=s=>String(s).toLowerCase().replace(/[\s\-_.()（）]/g,'');

/* ====================== 발음 ====================== */
function speak(text,lang){
  if(!('speechSynthesis' in window)){toast('이 기기는 소리 읽기를 지원하지 않아요');return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(lang==='ko'?text:(SAY[text]||text));
  u.lang=lang==='ko'?'ko-KR':'en-US';u.rate=lang==='ko'?1:S.set.rate;
  const v=speechSynthesis.getVoices().find(v=>v.lang===(lang==='ko'?'ko-KR':'en-US'));if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function sayBtn(id){return `<button class="speak noprint" onclick="event.stopPropagation();speak(BYID['${id}'].t)" aria-label="발음 듣기">${ICON.sound} 발음</button>`}

/* ====================== 타이머 (경화여고 도우미 방식) ====================== */
let tStart=0,tAcc=0,tickId=null,running=false;
function timerStart(acc){tAcc=acc||0;tStart=performance.now();running=true;clearInterval(tickId);tickId=setInterval(tick,500);tick()}
function timerNow(){return tAcc+(running?(performance.now()-tStart)/1000:0)}
function timerPause(){if(running){tAcc=timerNow();running=false}}
function timerResume(){if(!running&&tickId){tStart=performance.now();running=true}}
function timerStop(){const t=timerNow();running=false;clearInterval(tickId);tickId=null;return t}
function tick(){const el=$('#timer');if(!el)return;const t=timerNow();el.textContent=clock(t);el.classList.toggle('long',t>=SLOW_MAX)}
document.addEventListener('visibilitychange',()=>{if(document.hidden){timerPause();if(S.cur&&tickId){S.cur.acc=timerNow();save()}}else timerResume()});
function slowLimit(c){const ts=c.times||[];if(ts.length<3)return 12;const avg=ts.reduce((a,b)=>a+b,0)/ts.length;return Math.min(SLOW_MAX,Math.max(SLOW_MIN,avg*1.5))}

/* ====================== 문제 만들기 ====================== */
function opts(w,field){
  let pool=ALL.filter(x=>x.id!==w.id&&x[field]&&x[field]!==w[field]);
  const same=shuffle(pool.filter(x=>x.c===w.c)),other=shuffle(pool.filter(x=>x.c!==w.c));
  const pick=[];for(const x of same.concat(other)){if(pick.length>=3)break;if(!pick.some(p=>p[field]===x[field]))pick.push(x)}
  const all=shuffle([w,...pick]);return{o:all.map(x=>x[field]),a:all.indexOf(w)};
}
function makeQ(id,type){
  const w=BYID[id];if(!w)return null;
  if(type==='blank'&&!(w.s&&w.s.includes(w.t)))type='term';
  const q={id,type};
  if(type==='mean'){Object.assign(q,opts(w,'k'))}
  else if(type==='term'||type==='blank'){Object.assign(q,opts(w,'t'))}
  return q;
}
function mixType(id){
  const x=peek(id),w=BYID[id];
  const pool=['mean','term','blank','blank'];if(x.b>=2)pool.push('spell','recall');
  if(!(w.s&&w.s.includes(w.t)))return ['mean','term'][Math.floor(Math.random()*2)];
  return pool[Math.floor(Math.random()*pool.length)];
}
function newSession(o){return Object.assign({queue:[],done:0,idx:0,res:{},miss:{},graded:{},sel:null,shown:false,acc:0,times:[],ok:0,ng:0,sec:0,input:''},o)}
function startDaily(limit){
  const due=shuffle(dueList()).map(w=>w.id);
  const newLeft=Math.max(0,S.set.daily-todayNewDone());
  const nw=newList().slice(0,newLeft).map(w=>w.id);
  // 새 단어: 카드로 보고, 다음 카드 뒤에 확인 문제로 한 번 더 (클래스카드식 반복)
  const A=[];nw.forEach((id,i)=>{A.push({id,type:'card'});if(i>0)A.push(makeQ(nw[i-1],'mean'))});if(nw.length)A.push(makeQ(nw[nw.length-1],'term'));
  const B=due.map(id=>makeQ(id,mixType(id)));
  let q=[];while(A.length||B.length){q.push(...A.splice(0,2));if(B.length)q.push(B.shift())}
  q=q.filter(Boolean);
  // 새 단어는 카드로 본 뒤 몇 문제 뒤에 확인 문제로 한 번 더
  if(limit){if(!q.length){const extra=shuffle(ALL.filter(w=>peek(w.id).b>0)).slice(0,limit).map(w=>makeQ(w.id,mixType(w.id)));q=extra}q=q.slice(0,limit)}
  if(!q.length){
    const extra=shuffle(ALL.filter(w=>peek(w.id).b>0)).slice(0,10).map(w=>makeQ(w.id,mixType(w.id)));
    if(!extra.length){toast('먼저 새 단어부터 익혀 볼까요?');return}
    q=extra;
  }
  S.cur=newSession({kind:'daily',queue:q});save();go({name:'study'});cheer('start');
}
function startFiltered(kind){
  let ws=[];
  if(kind==='wrong')ws=ALL.filter(w=>peek(w.id).ng>=2&&peek(w.id).b<5);
  if(kind==='star')ws=ALL.filter(w=>peek(w.id).st);
  if(kind==='talk')ws=ALL.filter(w=>w.s&&w.s.includes(w.t)&&(peek(w.id).b>0||w.c==='talk'));
  if(!ws.length){toast(kind==='wrong'?'아직 헷갈린 단어가 없어요':kind==='star'?'단어장에서 별표를 눌러 모아 보세요':'단어가 없어요');return}
  const q=shuffle(ws).slice(0,15).map(w=>makeQ(w.id,kind==='talk'?'blank':mixType(w.id)));
  S.cur=newSession({kind:'free',label:{wrong:'헷갈린 단어',star:'별표 단어',talk:'대화 빈칸 연습'}[kind],queue:q});save();go({name:'study'});
}
function startMode(c,type){
  let ws=wordsOf(c);if(type==='blank')ws=ws.filter(w=>w.s&&w.s.includes(w.t));
  // 덜 익힌 단어부터
  ws=shuffle(ws).sort((a,b)=>peek(a.id).b-peek(b.id).b).slice(0,type==='card'?ws.length:20);
  const q=shuffle(ws).map(w=>type==='card'||type==='recall'||type==='spell'?{id:w.id,type}:makeQ(w.id,type));
  const nm={card:'암기 카드',recall:'리콜',spell:'스펠',blank:'대화 빈칸',mean:'뜻 고르기'}[type];
  S.cur=newSession({kind:'free',cat:c,label:catOf(c).name+' · '+nm,queue:q});save();go({name:'study'});
}
function nextAction(c){
  const cs=catState(c);
  if(S.cur&&S.cur.cat===c&&['test','practice'].includes(S.cur.kind)){go({name:'study'});return}
  if(S.cur&&!confirm('하던 공부가 있어요. 그만두고 새로 시작할까요?'))return;
  const ws=wordsOf(c).map(w=>w.id);
  if(cs.stage===0){S.cur=newSession({kind:'card',cat:c,label:catOf(c).name+' · 암기',queue:shuffle(ws).map(id=>({id,type:'card'}))})}
  else if(cs.stage===1||cs.stage===3||cs.stage===5){
    const r=(cs.stage-1)/2;const ids=r===0?ws:cs.r[r-1].pool;
    S.cur=newSession({kind:'test',cat:c,r,label:catOf(c).name+' · '+(r+1)+'차 시험',queue:shuffle(ids).map(id=>makeQ(id,['mean','mean','term','blank'][Math.floor(Math.random()*4)]))});
  }else if(cs.stage===2||cs.stage===4){
    const r=(cs.stage-2)/2;
    S.cur=newSession({kind:'practice',cat:c,r,label:catOf(c).name+' · '+(r+1)+'차 연습',queue:shuffle(cs.r[r].pool).map(id=>makeQ(id,mixType(id)==='spell'?'spell':['mean','term','blank'][Math.floor(Math.random()*3)]))});
  }else{go({name:'report'});return}
  save();go({name:'study'});
}
function sessionName(c){return c.kind==='daily'?'오늘 학습':(c.label||'연습')}

/* ====================== 학습 화면 ====================== */
function Study(){
  const c=S.cur;if(!c||!c.queue.length){return finishStudy()}
  const q=c.queue[0],w=BYID[q.id];
  if(!w){c.queue.shift();save();return Study()}
  const total=c.done+c.queue.length;
  const top=`<div class="topbar"><button class="btn ghost small" onclick="pauseStudy()">멈추기</button><span class="title">${esc(sessionName(c))}</span><span class="small muted">${c.done+1}/${total}</span><span class="timer" id="timer">00:00</span></div>
  <div class="prog"><i style="width:${pct(c.done,total)}%"></i></div>`;
  const tags=reasonTags(c,q);
  let body='';
  if(q.type==='card')body=CardView(c,q,w);
  else if(q.type==='recall')body=RecallView(c,q,w);
  else if(q.type==='spell')body=SpellView(c,q,w);
  else body=ChoiceView(c,q,w);
  return top+(tags?`<div style="margin-bottom:6px">${tags}</div>`:'')+body;
}
function reasonTags(c,q){
  const x=peek(q.id);let t=`<span class="tag cat" style="--hlc:${catOf(BYID[q.id].c).hl}">${esc(catOf(BYID[q.id].c).name)}</span>`;
  if(c.miss[q.id])t+='<span class="tag bad">다시 나온 단어</span>';
  else if(x.b===0&&!x.fs)t+='<span class="tag ok">새 단어</span>';
  else if(x.ng>=2&&x.b<3)t+='<span class="tag bad">자주 헷갈린 단어</span>';
  if(c.kind==='practice'&&!c.miss[q.id]){const r=catState(c.cat).r[c.r];const rr=r&&r.res[q.id];if(rr)t+=(rr.ok?'':'<span class="tag bad">시험에서 틀림</span>')+(rr.slow?`<span class="tag slow">${fmt(rr.t)} 고민</span>`:'')}
  return t;
}
function explain(w){
  return `<div class="back">
    <div class="row"><div class="k" style="margin:0">${esc(w.t)} <span class="muted" style="font-weight:400;font-size:15px">${esc(w.p||'')}</span></div><span class="spacer"></span>${sayBtn(w.id)}</div>
    <div style="font-size:18px;font-weight:700;margin:6px 0">${esc(w.k)}</div>
    ${w.d?`<div class="box d"><span class="lb">쉽게 말하면</span>${esc(w.d)}</div>`:''}
    ${w.my?`<div class="box my"><span class="lb">내 시스템에서는</span>${esc(w.my)}</div>`:''}
    ${w.s?`<div class="box s"><span class="lb">개발자가 이렇게 말해요</span>"${hiTerm(w.s,w.t)}"</div>`:''}
  </div>`;
}
function CardView(c,q,w){
  if(!c.shown)return `<div class="flash" onclick="flip()" role="button" tabindex="0">
      <div class="term">${esc(w.t)}</div><div class="pron">${esc(w.p||'')}</div>
      <div>${sayBtn(w.id)}</div>
      <div class="hint">눌러서 뜻 보기</div></div>
    <div class="two"><button class="btn badb" onclick="answerCard(false)">몰라요</button><button class="btn okb" onclick="answerCard(true)">알아요</button></div>
    <p class="small muted" style="text-align:center">뒤집어 보고 판단해도 되고, 바로 눌러도 돼요.</p>`;
  return `<div class="sheet">${explain(w)}</div>
    <div class="two"><button class="btn badb" onclick="answerCard(false)">몰라요</button><button class="btn okb" onclick="answerCard(true)">알아요</button></div>`;
}
function flip(){S.cur.shown=true;save();render()}
function RecallView(c,q,w){
  return `<div class="qtype">리콜 · 뜻을 보고 영어 단어를 떠올려 보세요</div>
  <div class="sheet"><div class="prompt">${esc(w.k)}</div>${w.d?`<div class="muted small">${esc(w.d)}</div>`:''}</div>
  ${c.shown?`<div class="sheet">${explain(w)}</div>
    <div class="two"><button class="btn badb" onclick="answerSelf(false)">못 떠올렸어요</button><button class="btn okb" onclick="answerSelf(true)">맞혔어요</button></div>`
  :`<button class="btn block" onclick="S.cur.shown=true;S.cur.acc=timerNow();save();render()">정답 보기</button>`}`;
}
function SpellView(c,q,w){
  const hasS=w.s&&w.s.includes(w.t);
  if(c.shown){const ok=c.lastOk;
    return `<div class="feedback ${ok?'ok':'bad'}">${ok?'정답이에요!':'아쉬워요. 정답은 '+esc(w.t)}${!ok&&c.input?` <span style="font-weight:400">(내 답: ${esc(c.input)})</span>`:''}</div>
    <div class="sheet">${explain(w)}</div><button class="btn block" id="nextBtn" onclick="nextQ()">다음</button>`}
  return `<div class="qtype">스펠 · 영어로 써 보세요 (대소문자·띄어쓰기는 상관없어요)</div>
  <div class="sheet"><div class="prompt">${esc(w.k)}</div>${hasS?`<div class="phrase muted">"${blankTerm(w.s,w.t)}"</div>`:''}</div>
  <input class="spellin" id="spell" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="여기에 입력" value="${esc(c.input||'')}" oninput="S.cur.input=this.value" onkeydown="if(event.key==='Enter')checkSpell()">
  <div class="row" style="margin-top:6px"><button class="linkbtn" onclick="hint()">힌트</button><span class="small muted" id="hintTxt">${c.hint?esc(c.hint):''}</span><span class="spacer"></span><button class="linkbtn" onclick="S.cur.input='';checkSpell(true)">모르겠어요</button></div>
  <button class="btn block" onclick="checkSpell()">확인</button>`;
}
function hint(){const c=S.cur,w=BYID[c.queue[0].id];c.hintN=(c.hintN||0)+1;const n=Math.min(c.hintN,w.t.length-1);c.hint=w.t.slice(0,n)+w.t.slice(n).replace(/[^\s\-.]/g,'_');save();render()}
function ChoiceView(c,q,w){
  let head='';
  if(q.type==='mean')head=`<div class="qtype">이 말의 뜻은?</div><div class="prompt term">${esc(w.t)}</div><div class="muted">${esc(w.p||'')}</div>${sayBtn(w.id)}`;
  else if(q.type==='term')head=`<div class="qtype">어떤 단어일까요?</div><div class="prompt">${esc(w.k)}</div>${w.d?`<div class="muted small">${esc(w.d)}</div>`:''}`;
  else head=`<div class="qtype">개발자 말의 빈칸에 들어갈 단어는?</div><div class="prompt phrase">"${blankTerm(w.s,w.t)}"</div>`;
  const test=c.kind==='test',show=c.shown&&!test;
  return `<div class="sheet">${head}
  <div class="opts">${q.o.map((o,i)=>{let cl='';if(show){if(i===q.a)cl='right';else if(i===c.sel)cl='wrong'}else if(i===c.sel)cl='sel';
    return `<button class="opt ${cl}" ${show?'disabled':''} onclick="pick(${i})"><span class="n">${NUM[i]}</span><span>${esc(o)}</span></button>`}).join('')}</div></div>
  ${test?`<button class="btn block" ${c.sel==null?'disabled':''} onclick="confirmTest()">답 확정하고 다음</button><p class="small muted" style="text-align:center">정답은 시험이 끝나고 한꺼번에 알려 줘요.</p>`
   :show?`<div class="feedback ${c.sel===q.a?'ok':'bad'}">${c.sel===q.a?(c.wasSlow?'정답! 다만 조금 오래 걸렸어요':'정답이에요!'):'틀렸어요. 몇 문제 뒤에 다시 나와요'}</div><div class="sheet">${explain(w)}</div><button class="btn block" id="nextBtn" onclick="nextQ()">다음</button>`
   :`<button class="btn block" ${c.sel==null?'disabled':''} onclick="checkChoice()">정답 확인</button>`}`;
}
function afterStudyRender(){
  const c=S.cur;if(!c||!c.queue.length)return;
  if(!c.shown){timerStart(c.acc||0);const q=c.queue[0];if(S.set.auto&&(q.type==='card'||q.type==='mean'))setTimeout(()=>speak(BYID[q.id].t),250)}
  else{const el=$('#timer');if(el)el.textContent=clock(c.lastT||0)}
  const sp=$('#spell');if(sp&&!c.shown)sp.focus();
  const nb=$('#nextBtn');if(nb)nb.focus({preventScroll:true});
}
function pauseStudy(){if(S.cur){S.cur.acc=timerNow()}timerStop();save();go({name:view.from||'home'})}
function pick(i){const c=S.cur;if(c.shown&&c.kind!=='test')return;c.sel=i;c.acc=timerNow();save();
  if(c.kind!=='test'){checkChoice()}else render()}
/* 채점 공통 */
function record(ok,t,qq){
  const c=S.cur,q=qq||c.queue[0],lim=slowLimit(c),slow=ok&&t>lim;
  c.times.push(t);c.sec+=t;
  const first=!c.graded[q.id];c.graded[q.id]=1;
  if(c.kind!=='test')grade(q.id,ok,slow,first&&!c.miss[q.id]);
  else{if(!ok)grade(q.id,false);else st(q.id).ok++}
  if(ok&&first)c.ok++;if(!ok)c.ng++;
  if(c.kind!=='test'){if(ok){c.run=(c.run||0)+1;if(c.run===3)cheer('s3');else if(c.run===5)cheer('s5');else if(c.run===10)cheer('s10')}else{c.run=0;cheer('wrong')}}
  logDay(1,ok?1:0,ok?0:1,t);
  st(q.id).t=Math.round(t);
  return slow;
}
function requeue(c,q){c.miss[q.id]=(c.miss[q.id]||0)+1;const nq=q.type==='card'?{id:q.id,type:'card'}:(q.o?makeQ(q.id,q.type):{id:q.id,type:q.type});c.queue.splice(Math.min(c.queue.length,3),0,nq)}
function answerCard(known){
  const c=S.cur,q=c.queue.shift(),t=timerStop();
  c.times.push(Math.min(t,SLOW_MAX));c.sec+=t;
  const x=st(q.id),tday=today();const first=!c.graded[q.id];c.graded[q.id]=1;
  if(!x.fs)x.fs=tday;
  if(known){if(first&&!c.miss[q.id]&&x.b===0){x.b=2;x.due=tday+INT[2]}else if(first&&!c.miss[q.id]){x.b=Math.min(6,x.b+1);x.due=tday+INT[x.b]}else if(x.b===0){x.b=1;x.due=tday+1}else if(x.due<=tday){x.due=tday+1}c.done++;if(first)c.ok++;x.ok++}
  else{x.b=1;x.due=tday;x.ng++;c.ng++;c.queue.unshift(q);requeue(c,c.queue.shift())}
  logDay(1,known?1:0,known?0:1,t);
  c.shown=false;c.acc=0;save();render();
}
function answerSelf(ok){
  const c=S.cur,q=c.queue[0];const t=c.acc||timerStop();timerStop();
  record(ok,t);c.queue.shift();if(ok)c.done++;else requeue(c,q);
  c.shown=false;c.acc=0;save();render();
}
function checkChoice(){
  const c=S.cur,q=c.queue[0];if(c.sel==null)return;
  const t=timerStop();c.lastT=t;const ok=c.sel===q.a;c.wasSlow=record(ok,t);c.lastOk=ok;c.shown=true;save();render();
}
function checkSpell(giveup){
  const c=S.cur,q=c.queue[0],w=BYID[q.id];const v=giveup?'':(($('#spell')||{}).value||c.input||'');
  if(!giveup&&!v.trim()){toast('답을 입력해 주세요');return}
  const t=timerStop();c.lastT=t;c.input=v;
  const ok=!giveup&&norm(v)===norm(w.t)&&!(c.hintN>=Math.max(2,w.t.length-1));
  c.wasSlow=record(ok,t+(c.hintN||0)*4);c.lastOk=ok;c.shown=true;save();render();
}
function nextQ(){
  const c=S.cur,q=c.queue.shift();
  if(c.lastOk){c.done++;progressCheer(c)}else requeue(c,q);
  Object.assign(c,{sel:null,shown:false,acc:0,input:'',hint:'',hintN:0,lastOk:false,wasSlow:false});save();render();window.scrollTo(0,0);
}
function confirmTest(){
  const c=S.cur,q=c.queue.shift();if(c.sel==null)return;
  const t=timerStop(),ok=c.sel===q.a;
  c.res[q.id]={ok,t:Math.round(t),sel:q.o[c.sel],ans:q.o[q.a],type:q.type};
  record(ok,t,q);c.done++;c.sel=null;c.acc=0;progressCheer(c);save();render();window.scrollTo(0,0);
}
/* 학습 끝 */
function finishStudy(){
  const c=S.cur;if(!c){go({name:'home'});return''}
  timerStop();
  let msg='';
  if(c.kind==='test'){
    const cs=catState(c.cat),ids=Object.keys(c.res),lim=slowLimit(c);
    ids.forEach(id=>c.res[id].slow=c.res[id].ok&&c.res[id].t>lim);
    const pool=ids.filter(id=>!c.res[id].ok||c.res[id].slow);
    const ok=ids.filter(id=>c.res[id].ok).length;
    const avg=ids.reduce((a,id)=>a+c.res[id].t,0)/Math.max(ids.length,1);
    cs.r[c.r]={n:ids.length,ok,avg,pool,res:c.res,at:Date.now()};
    // 맞혔고 빨랐던 단어는 복습 단계를 올림
    ids.forEach(id=>{if(c.res[id].ok&&!c.res[id].slow){const x=st(id);x.b=Math.min(6,Math.max(x.b,1)+1);x.due=today()+INT[x.b];if(!x.fs)x.fs=today()}else if(c.res[id].ok){const x=st(id);x.b=Math.max(1,x.b);x.due=today()+1;if(!x.fs)x.fs=today()}});
    cs.stage=pool.length&&c.r<2?(c.r*2+2):6;
    S.last={kind:'test',cat:c.cat,r:c.r,n:ids.length,ok,avg,pool,res:c.res};
  }else{
    if(c.kind==='card'){const cs=catState(c.cat);if(cs.stage===0)cs.stage=1}
    if(c.kind==='practice'){const cs=catState(c.cat);cs.stage=c.r*2+3}
    S.last={kind:c.kind,label:sessionName(c),n:c.done,ok:c.ok,ng:c.ng,sec:c.sec,miss:Object.keys(c.miss),cat:c.cat};
  }
  S.cur=null;save();
  view={name:'result'};return Result();
}

    ${wrong.length?`<h3>틀린 단어</h3>${wrong.map(id=>missRow(id,L.res[id])).join('')}`:''}
    ${slow.length?`<h3>맞혔지만 오래 고민한 단어</h3>${slow.map(id=>missRow(id,L.res[id])).join('')}`:''}`;
  }

  ${missed.length?`<p>그중 <b>${missed.length}개</b>는 한 번 이상 틀렸어요. 이 단어들은 오늘 다시 학습할 때 또 나와요.</p>`:'<p>한 번도 틀리지 않았어요.</p>'}
  <div class="small muted">오늘 푼 문제 ${d.n}개 · 목표 ${S.set.goal}개 · 연속 ${streak()}일</div>
  ${L.kind==='card'&&L.cat?`<button class="btn block" onclick="nextAction('${L.cat}')">${stageLabel(L.cat)}</button>`:''}
  <button class="btn ${L.kind==='card'&&L.cat?'ghost ':''}block" onclick="go({name:'home'})">홈으로</button></div>
  ${missed.length?`<h3>틀렸던 단어</h3>${missed.map(id=>missRow(id)).join('')}`:''}`;
}
function missRow(id,r){const w=BYID[id];if(!w)return'';
  return `<div class="sheet" style="padding:12px" onclick="openWord('${id}')"><div class="row"><b>${esc(w.t)}</b><span class="muted small">${esc(w.p||'')}</span><span class="spacer"></span>${r?`<span class="tag ${r.ok?'slow':'bad'}">${r.ok?fmt(r.t)+' 고민':'내 답: '+esc(r.sel)}</span>`:''}</div><div class="small">${esc(w.k)}</div></div>`}

/* ====================== 짝 맞추기 ====================== */
let M=null;
function startMatch(c){
  let ws=c?wordsOf(c):ALL.filter(w=>peek(w.id).b>0);if(ws.length<6)ws=c?wordsOf(c):ALL;
  ws=shuffle(ws).slice(0,6);
  const tiles=shuffle([...ws.map(w=>({id:w.id,side:'t',txt:w.t})),...ws.map(w=>({id:w.id,side:'k',txt:w.k}))]);
  M={c,tiles,sel:null,gone:{},wrong:0,start:performance.now()};
  view={name:'match'};renderMatch();
}
function renderMatch(){
  const c=M.c?catOf(M.c):null;
  $('#nav').style.display='none';

function Report(){
  const total=ALL.length,lv=[0,0,0,0];ALL.forEach(w=>lv[level(peek(w.id).b)]++);
  const t=today(),days=[];for(let i=13;i>=0;i--){const k=dkey(t-i);days.push({k,n:(S.days[k]||{}).n||0})}
  const maxN=Math.max(5,...days.map(d=>d.n));
  const allDays=Object.values(S.days);const sumN=allDays.reduce((a,d)=>a+d.n,0),sumOk=allDays.reduce((a,d)=>a+d.ok,0),sumSec=allDays.reduce((a,d)=>a+d.sec,0);
  const cats=CATS.map(c=>{const ws=wordsOf(c.id);const got=ws.filter(w=>peek(w.id).b>=5).length;const seen=ws.filter(w=>peek(w.id).ok+peek(w.id).ng>0);const ok=seen.reduce((a,w)=>a+peek(w.id).ok,0),ng=seen.reduce((a,w)=>a+peek(w.id).ng,0);const r1=(S.rounds[c.id]||{r:[]}).r[0];return{c,n:ws.length,got,acc:ok+ng?ok/(ok+ng):null,r1,seen:seen.length}}).filter(x=>x.n);
  const confused=ALL.filter(w=>peek(w.id).ng>=2).sort((a,b)=>peek(b.id).ng-peek(a.id).ng||peek(a.id).b-peek(b.id).b).slice(0,10);
  const slow=ALL.filter(w=>peek(w.id).t>=SLOW_MIN&&peek(w.id).b<5).sort((a,b)=>peek(b.id).t-peek(a.id).t).slice(0,10);
  const started=ALL.filter(w=>peek(w.id).fs).length;
  const mastery=(lv[2]*0.6+lv[3])/Math.max(total,1);
  const overall=!started?'아직 시작 전이에요':mastery>=0.7?'개발자 회의를 거의 따라갈 수 있어요':mastery>=0.4?'자주 나오는 말은 익숙해졌어요':mastery>=0.15?'기초를 쌓는 중이에요':'첫걸음을 뗐어요';
  const weak=cats.filter(x=>x.seen).sort((a,b)=>(a.got/a.n)-(b.got/b.n))[0];
  const untouched=cats.filter(x=>!x.seen);
  const plan=[];
  const due=dueList().length;
  if(due)plan.push(`오늘 복습할 단어가 <b>${due}개</b> 있어요. 복습을 미루면 다음 날 한꺼번에 몰려요.`);
  if(weak&&weak.got<weak.n)plan.push(`<b>${esc(weak.c.name)}</b> 분야의 익힘이 가장 낮아요 (${pct(weak.got,weak.n)}%). 분야 화면에서 다음 차수를 이어 가세요.`);
  if(untouched.length)plan.push(`아직 안 연 분야: ${untouched.map(x=>esc(x.c.name)).join(', ')}. 개발자와 이야기할 일이 있다면 <b>개발자 회의 말</b>부터 추천해요.`);
  if(confused.length)plan.push(`끝까지 헷갈리는 단어 ${confused.length}개는 "내 시스템에서는" 예시를 소리 내어 읽어 보세요. 내 일과 이어지면 오래 기억돼요.`);
  if(S.set.meet){const n=Math.ceil((new Date(S.set.meet+'T00:00:00')-new Date(new Date().toDateString()))/86400000);const left=lv[0];if(n>0)plan.push(`개발자 미팅까지 ${n}일 남았어요. 새 단어 ${left}개를 다 보려면 하루 ${Math.ceil(left/n)}개씩이에요. 설정의 "하루 새 단어 수"를 맞춰 두세요.`)}
  if(!plan.length)plan.push('지금처럼 하루 한 번, 짬 날 때 "오늘 학습"만 눌러도 충분해요.');
  REPORT_TXT=`[짬짬이 IT 영단어] ${dkey(t)}\n상태: ${overall}\n내 말 됐음 ${lv[3]}/${total} · 거의 익힘 ${lv[2]} · 익히는 중 ${lv[1]}\n푼 문제 ${sumN}개 · 정답률 ${pct(sumOk,sumN)}% · 연속 ${streak()}일\n헷갈린 단어: ${confused.slice(0,5).map(w=>w.t).join(', ')||'없음'}`;
  return `<div class="row noprint"><span class="spacer"></span><button class="btn ghost small" onclick="shareReport()">공유(카톡)</button><button class="btn ghost small" onclick="window.print()">인쇄</button></div>
  <h2 class="hand"><span class="hl">학습 보고서</span></h2>
  <div class="printonly small">출력일 ${dkey(t)} · 짬짬이 IT 영단어</div>
  <div class="sheet"><div class="sub" style="margin:0">지금 상태</div><div class="status">${overall}</div>
    <div class="small muted">시작한 단어 ${started}/${total} · 푼 문제 ${sumN}개 · 정답률 ${pct(sumOk,sumN)}% · 공부 시간 ${fmt(sumSec)} · 연속 ${streak()}일</div>
    <div class="bar" style="margin-top:10px">${lv.map((n,i)=>`<i style="width:${pct(n,total)}%;background:${LV[i].c}"></i>`).join('')}</div>
    <div class="legend">${LV.map((x,i)=>`<span><i style="background:${x.c}"></i>${x.n} ${lv[i]}</span>`).join('')}</div></div>
  <div class="sheet"><h3>앞으로 할 일</h3><ul class="todo">${plan.map(p=>`<li>${p}</li>`).join('')}</ul></div>
  <div class="sheet"><h3>최근 14일 푼 문제</h3><div class="chart">${days.map(d=>`<div title="${d.k} ${d.n}개"><i style="height:${Math.round(d.n/maxN*90)}%"></i><span>${+d.k.slice(8)}</span></div>`).join('')}</div></div>
  <div class="sheet"><h3>분야별</h3><table><tr><th>분야</th><th class="num">단어</th><th class="num">내 말 됐음</th><th class="num">정답률</th><th class="num">1차 시험</th></tr>
    ${cats.map(x=>`<tr><td>${esc(x.c.name)}</td><td class="num">${x.n}</td><td class="num">${x.got} (${pct(x.got,x.n)}%)</td><td class="num">${x.acc==null?'–':Math.round(x.acc*100)+'%'}</td><td class="num">${x.r1?pct(x.r1.ok,x.r1.n)+'%':'–'}</td></tr>`).join('')}</table></div>
  <div class="sheet"><h3>끝까지 헷갈린 단어</h3>${confused.length?`<table><tr><th>단어</th><th>뜻</th><th class="num">틀림</th></tr>${confused.map(w=>`<tr onclick="openWord('${w.id}')"><td><b>${esc(w.t)}</b></td><td>${esc(w.k)}</td><td class="num">${peek(w.id).ng}</td></tr>`).join('')}</table>`:'<p class="muted small">아직 없어요.</p>'}</div>
  <div class="sheet"><h3>가장 오래 고민한 단어</h3>${slow.length?`<table><tr><th>단어</th><th>뜻</th><th class="num">최근 시간</th></tr>${slow.map(w=>`<tr onclick="openWord('${w.id}')"><td><b>${esc(w.t)}</b></td><td>${esc(w.k)}</td><td class="num">${fmt(peek(w.id).t)}</td></tr>`).join('')}</table>`:'<p class="muted small">아직 없어요.</p>'}</div>`;
}

  <div class="sheet"><h3>휴대폰에 앱으로 설치</h3>
    ${installEvt?`<button class="btn block" onclick="installEvt.prompt();installEvt=null">지금 설치하기</button>`:''}
    <p class="small" style="margin:6px 0 0">안드로이드(크롬): 오른쪽 위 ⋮ → <b>홈 화면에 추가</b> 또는 <b>앱 설치</b><br>아이폰(사파리): 아래 공유 버튼 → <b>홈 화면에 추가</b><br>설치하면 인터넷이 없어도 열려요.</p></div>
  <div class="sheet"><h3>학습 기록</h3>
    <p class="small muted" style="margin-top:0">기록은 이 기기 안에만 저장돼요. 휴대폰을 바꾸거나 PC에서도 이어 하려면 파일로 내보낸 뒤 다른 기기에서 불러오세요.</p>
    <div class="two"><button class="btn ghost" onclick="exportData()">파일로 내보내기</button><button class="btn ghost" onclick="$('#imp').click()">파일 불러오기</button></div>
    <input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importData(this.files[0])">
    ${hidden?`<button class="btn ghost block" onclick="if(confirm('숨긴 단어 ${hidden}개를 다시 보이게 할까요?')){S.hide={};save();buildWords();render()}">숨긴 단어 ${hidden}개 다시 보이기</button>`:''}
    <button class="linkbtn" style="color:var(--bad)" onclick="resetAll()">모든 기록 지우고 처음부터</button></div>
  <p class="small muted" style="text-align:center">짬짬이 IT 영단어 v001 · 단어 ${ALL.length}개</p>`;
}
function exportData(){
  const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='IT영단어_학습기록_'+dkey(today()).replace(/-/g,'')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importData(f){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.w||!x.set)throw 0;if(!confirm('불러온 기록으로 바꿀까요? 지금 이 기기의 기록은 덮어써져요.'))return;localStorage.setItem(KEY,JSON.stringify(x));load();buildWords();toast('불러왔어요');go({name:'home'})}catch(e){toast('학습 기록 파일이 아니에요')}};
  r.readAsText(f);
}
function resetAll(){if(confirm('모든 학습 기록을 지울까요? 되돌릴 수 없어요. 필요하면 먼저 "파일로 내보내기"를 하세요.')){const keep=S.custom;S=blank();S.custom=keep;save();buildWords();go({name:'home'})}}

/* ====================== 키보드 (PC) ====================== */
document.addEventListener('keydown',e=>{
  if(view.name!=='study'||!S.cur||!S.cur.queue.length)return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  const c=S.cur,q=c.queue[0];
  if(q.type==='card'){if(e.key===' '){e.preventDefault();flip()}if(e.key==='ArrowLeft')answerCard(false);if(e.key==='ArrowRight')answerCard(true);return}
  if(q.o&&!c.shown&&'1234'.includes(e.key)){pick(+e.key-1);return}
  if(e.key==='Enter'){if(c.kind==='test'&&c.sel!=null)confirmTest();else if(c.shown&&$('#nextBtn'))nextQ()}
});

/* ====================== 시작 ====================== */
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js');
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});   // 기록이 지워지지 않게 요청
if(window.top!==window.self)setTimeout(()=>toast('다른 화면 안에서 열렸어요. 기록이 지워질 수 있으니 주소를 직접 열어 주세요'),800);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.set.theme==='auto')render()});
if(speechSynthesis&&speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=()=>{};
render();
</script>
</body>
</html>
